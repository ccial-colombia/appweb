<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <link rel="icon" href="assets/images/favicon-192x192.png" type="image/png">
    <title>Administración | CCI AL/Colombia</title>
    <script>
        // Tema del panel: "light" (claro), "dark" (oscuro) o "auto" (el del sistema).
        // Se guarda en este navegador y se aplica antes de pintar la página, para que no parpadee.
        // Usa el modo oscuro de Bootstrap 5.3 (atributo data-bs-theme en <html>).
        var CLAVE_TEMA = "admin-tema";
        var consultaOscuro = window.matchMedia("(prefers-color-scheme: dark)");

        function temaGuardado() {
            try {
                var tema = localStorage.getItem(CLAVE_TEMA);
                if (tema === "light" || tema === "dark") return tema;
            } catch (e) { /* sin acceso al almacenamiento: se usa el del sistema */ }
            return "auto";
        }

        var temaActual = temaGuardado();

        function aplicarTema(tema) {
            var oscuro = tema === "dark" || (tema === "auto" && consultaOscuro.matches);
            document.documentElement.setAttribute("data-bs-theme", oscuro ? "dark" : "light");
            document.querySelectorAll("#selector-tema [data-tema]").forEach(function (boton) {
                var activo = boton.getAttribute("data-tema") === tema;
                boton.classList.toggle("active", activo);
                boton.setAttribute("aria-pressed", activo ? "true" : "false");
            });
        }

        function cambiarTema(tema) {
            temaActual = tema;
            try { localStorage.setItem(CLAVE_TEMA, tema); } catch (e) { /* solo dura esta visita */ }
            aplicarTema(tema);
        }

        // En "Sistema", el panel cambia solo cuando cambia el tema del dispositivo.
        consultaOscuro.addEventListener("change", function () {
            if (temaActual === "auto") aplicarTema("auto");
        });
        document.addEventListener("DOMContentLoaded", function () { aplicarTema(temaActual); });
        aplicarTema(temaActual);
    </script>
    <!-- Bootstrap 5.3 solo en el panel (el sitio usa 5.0.1): trae el modo oscuro. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Íconos del menú lateral, las tarjetas de resumen y los botones. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <style>
        /* ==================== DISEÑO TIPO TABLERO ====================
           Colores de la web: azul #05386b, verde #045e5c y amarillo #ffe161.
           Tarjetas, tablas y ventanas usan los colores de Bootstrap según el tema. */
        :root {
            --marca-azul: #05386b;
            --marca-azul-claro: #0a4a8a;
            --marca-azul-oscuro: #042b52;
            --marca-verde: #045e5c;
            --marca-verde-claro: #067572;
            --marca-amarillo: #ffe161;
            --fondo-panel: #f3f5f8;
            --borde-suave: rgba(15, 23, 42, 0.08);
            --sombra-tarjeta: 0 1px 2px rgba(15, 23, 42, 0.05), 0 2px 6px rgba(15, 23, 42, 0.04);
            --ancho-lateral: 264px;
            --bs-body-font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        [data-bs-theme="dark"] {
            --fondo-panel: #0f141a;
            --borde-suave: rgba(255, 255, 255, 0.08);
            --sombra-tarjeta: none;
        }
        body { background: var(--fondo-panel); }

        /* Botones con los colores de la web. */
        .btn-primary {
            --bs-btn-bg: var(--marca-azul); --bs-btn-border-color: var(--marca-azul);
            --bs-btn-hover-bg: var(--marca-azul-claro); --bs-btn-hover-border-color: var(--marca-azul-claro);
            --bs-btn-active-bg: var(--marca-azul-oscuro); --bs-btn-active-border-color: var(--marca-azul-oscuro);
            --bs-btn-disabled-bg: var(--marca-azul); --bs-btn-disabled-border-color: var(--marca-azul);
        }
        .btn-success {
            --bs-btn-bg: var(--marca-verde); --bs-btn-border-color: var(--marca-verde);
            --bs-btn-hover-bg: var(--marca-verde-claro); --bs-btn-hover-border-color: var(--marca-verde-claro);
            --bs-btn-active-bg: #034846; --bs-btn-active-border-color: #034846;
        }
        [data-bs-theme="dark"] .btn-primary {
            --bs-btn-bg: #1f5f9e; --bs-btn-border-color: #1f5f9e;
            --bs-btn-hover-bg: #2b6fb3; --bs-btn-hover-border-color: #2b6fb3;
        }
        [data-bs-theme="dark"] .btn-success {
            --bs-btn-bg: #0b7d79; --bs-btn-border-color: #0b7d79;
            --bs-btn-hover-bg: #0f918c; --bs-btn-hover-border-color: #0f918c;
        }

        /* ---------- Acceso ---------- */
        #vista-login {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            background: radial-gradient(circle at 15% 20%, rgba(4, 94, 92, 0.12), transparent 45%),
                        radial-gradient(circle at 85% 80%, rgba(5, 56, 107, 0.14), transparent 45%), var(--fondo-panel);
        }
        .tarjeta-login {
            display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 840px;
            background: var(--bs-body-bg); border-radius: 1.25rem; overflow: hidden;
            box-shadow: 0 24px 60px rgba(5, 56, 107, 0.18);
        }
        .login-marca {
            display: flex; flex-direction: column; justify-content: center; gap: 1.25rem; padding: 2.75rem;
            background: linear-gradient(160deg, var(--marca-azul) 0%, var(--marca-verde) 100%); color: #fff;
        }
        .login-logo { width: 240px; max-width: 100%; height: auto; }
        .login-marca p { margin: 0; color: rgba(255, 255, 255, 0.82); line-height: 1.6; }
        .login-formulario { padding: 2.75rem; }
        @media (max-width: 767.98px) {
            .tarjeta-login { grid-template-columns: 1fr; max-width: 420px; }
            .login-marca { align-items: center; text-align: center; padding: 1.75rem; }
            .login-formulario { padding: 1.75rem; }
        }

        /* ---------- Estructura: menú lateral + contenido ---------- */
        .tablero { min-height: 100vh; }
        @media (min-width: 992px) {
            .tablero { display: grid; grid-template-columns: var(--ancho-lateral) minmax(0, 1fr); }
        }
        /* Menú lateral: fijo en pantallas grandes; en celulares y tabletas se abre con el
           botón de la barra superior (offcanvas de Bootstrap). */
        .tablero .barra-lateral {
            --bs-offcanvas-width: var(--ancho-lateral);
            --bs-offcanvas-bg: var(--marca-azul);
            --bs-offcanvas-color: #fff;
            display: flex; flex-direction: column; color: #fff;
            background: linear-gradient(180deg, var(--marca-azul) 0%, #042a50 100%) !important;
        }
        @media (min-width: 992px) {
            .tablero .barra-lateral { position: sticky; top: 0; height: 100vh; }
        }
        .barra-marca {
            display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
            padding: 1rem 1.25rem 0.875rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .barra-marca img { display: block; height: 38px; width: auto; }
        .barra-marca small { display: block; margin-top: 0.375rem; font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); letter-spacing: 0.02em; }
        .barra-cuerpo { flex: 1 1 auto; overflow-y: auto; padding: 0.375rem 0.75rem 1rem; }
        .grupo-menu {
            padding: 0.875rem 0.75rem 0.25rem; font-size: 0.6875rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.5);
        }
        #menu-tablas .nav-link {
            position: relative; display: flex; align-items: center; gap: 0.75rem;
            padding: 0.4375rem 0.75rem; margin-bottom: 1px; border-radius: 0.5rem;
            font-size: 0.9375rem; color: rgba(255, 255, 255, 0.78); cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
        }
        #menu-tablas .nav-link .bi { font-size: 1.05rem; width: 1.25rem; text-align: center; opacity: 0.85; }
        #menu-tablas .nav-link:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        #menu-tablas .nav-link.active { background: rgba(255, 255, 255, 0.14); color: #fff; font-weight: 600; }
        #menu-tablas .nav-link.active .bi { opacity: 1; color: var(--marca-amarillo); }
        #menu-tablas .nav-link.active::before {
            content: ""; position: absolute; left: -0.75rem; top: 0.45rem; bottom: 0.45rem;
            width: 3px; border-radius: 0 3px 3px 0; background: var(--marca-amarillo);
        }

        /* ---------- Barra superior ---------- */
        .barra-superior {
            position: sticky; top: 0; z-index: 1020; display: flex; align-items: center; gap: 0.75rem;
            min-height: 64px; padding: 0.625rem 1.5rem;
            background: var(--bs-body-bg); border-bottom: 1px solid var(--borde-suave);
        }
        .miga { font-size: 0.875rem; color: var(--bs-secondary-color); }
        .miga .bi { font-size: 0.7rem; }
        .miga #miga-grupo { color: var(--bs-body-color); font-weight: 500; }
        .usuario { align-items: center; gap: 0.5rem; max-width: 240px; }
        .avatar {
            display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%;
            background: rgba(5, 56, 107, 0.1); color: var(--marca-azul);
        }
        [data-bs-theme="dark"] .avatar { background: rgba(255, 255, 255, 0.1); color: #fff; }

        /* ---------- Contenido ---------- */
        .tablero-contenido { padding: 1.5rem; }
        @media (max-width: 575.98px) {
            .tablero-contenido { padding: 1rem; }
            .barra-superior { padding: 0.5rem 1rem; }
        }
        .encabezado-tabla {
            display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
            gap: 1rem; margin-bottom: 1.25rem;
        }
        .eyebrow {
            margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.08em; color: var(--marca-verde);
        }
        [data-bs-theme="dark"] .eyebrow { color: #5fd3c8; }
        #titulo-tabla { font-weight: 700; letter-spacing: -0.01em; }
        #descripcion-tabla { margin: 0.25rem 0 0; font-size: 0.9375rem; color: var(--bs-secondary-color); }

        .tarjeta {
            background: var(--bs-body-bg); border: 1px solid var(--borde-suave);
            border-radius: 0.875rem; box-shadow: var(--sombra-tarjeta);
        }
        /* Tarjetas de resumen (registros, visibles, ocultos, páginas). */
        .tarjeta-resumen { display: flex; align-items: center; gap: 0.875rem; height: 100%; padding: 1rem 1.125rem; }
        .tarjeta-resumen .icono {
            display: grid; place-items: center; flex: none; width: 44px; height: 44px;
            border-radius: 0.75rem; font-size: 1.25rem;
        }
        .tarjeta-resumen .valor { font-size: 1.5rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
        .tarjeta-resumen .texto { font-size: 0.8125rem; color: var(--bs-secondary-color); }
        .icono.azul { background: rgba(5, 56, 107, 0.1); color: var(--marca-azul); }
        .icono.verde { background: rgba(25, 135, 84, 0.12); color: #198754; }
        .icono.gris { background: rgba(108, 117, 125, 0.14); color: #6c757d; }
        .icono.turquesa { background: rgba(4, 94, 92, 0.12); color: var(--marca-verde); }
        [data-bs-theme="dark"] .icono.azul { background: rgba(110, 168, 254, 0.15); color: #8bb9fe; }
        [data-bs-theme="dark"] .icono.verde { background: rgba(117, 183, 152, 0.15); color: #75b798; }
        [data-bs-theme="dark"] .icono.gris { background: rgba(173, 181, 189, 0.14); color: #adb5bd; }
        [data-bs-theme="dark"] .icono.turquesa { background: rgba(95, 211, 200, 0.14); color: #5fd3c8; }

        /* Tabla de datos dentro de una tarjeta. */
        .tarjeta-tabla { overflow: hidden; }
        .tarjeta-tabla .table { --bs-table-bg: transparent; --bs-table-border-color: var(--borde-suave); }
        /* Los encabezados largos ("Abrir en una pestaña nueva") pueden ir en dos líneas. */
        .tarjeta-tabla thead th {
            padding: 0.75rem 0.875rem; min-width: 4.5rem; vertical-align: bottom; line-height: 1.35;
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--bs-secondary-color); background: var(--bs-tertiary-bg);
        }
        .tarjeta-tabla tbody td { padding: 0.625rem 0.875rem; }
        .tarjeta-tabla .celda-texto { max-width: 240px; }
        /* En pantallas grandes la columna de acciones queda fija a la derecha: si la tabla
           es más ancha que la pantalla, Editar y Eliminar se siguen viendo. */
        @media (min-width: 992px) {
            .tarjeta-tabla tr > :last-child:not(.estado-vacio) { position: sticky; right: 0; z-index: 1; }
            .tarjeta-tabla tbody tr > td:last-child { background: var(--bs-body-bg); }
            .tarjeta-tabla tr > :last-child:not(.estado-vacio)::before {
                content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: var(--borde-suave);
            }
        }
        .tarjeta-tabla tbody tr:last-child td { border-bottom: 0; }
        .tarjeta-tabla .badge { font-weight: 600; }
        .estado-vacio { padding: 3rem 1rem !important; text-align: center; color: var(--bs-secondary-color); }
        .estado-vacio .bi { display: block; margin-bottom: 0.5rem; font-size: 2rem; opacity: 0.6; }
        #alerta { border-radius: 0.75rem; }

        /* Ventana de agregar / editar. */
        .modal-content { border: 0; border-radius: 1rem; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); }
        .modal-header, .modal-footer { padding: 1rem 1.5rem; border-color: var(--borde-suave); }
        .modal-body { padding: 1.25rem 1.5rem; }
        .modal-title { font-weight: 700; }

        .celda-texto { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Fondo gris para que se vean también las imágenes blancas o transparentes (logos). */
        .miniatura-rect { width: 72px; height: 48px; object-fit: contain; border-radius: 4px; background: #9aa0a6; }
        .vista-previa-rect { max-height: 160px; max-width: 100%; border-radius: 8px; display: block; background: #9aa0a6; padding: 4px; }
        /* Campos de color (Estilos de títulos): muestra en la tabla y selector en el formulario. */
        .muestra-color {
            display: inline-block; width: 1.1rem; height: 1.1rem; margin-right: 0.5rem; vertical-align: -0.2em;
            border-radius: 4px; border: 1px solid var(--borde-suave);
        }
        .campo-color .form-control-color { width: 3.5rem; height: 2.5rem; transition: opacity 0.15s; }
        .campo-color.usa-original .form-control-color { opacity: 0.4; }
        /* Vista previa de estilos: fondo blanco en los dos temas, como en la web. */
        .vista-previa-estilo {
            padding: 1.25rem 1.5rem; border-radius: 0.75rem; border: 1px solid var(--borde-suave);
            background: #fff; color: #212529; overflow-wrap: anywhere;
        }
        .vista-previa-estilo .muestra-estilo { line-height: 1.25; }
        .vista-previa-estilo .nota-estilo { margin-top: 0.75rem; font-size: 0.8125rem; color: #6c757d; }
        /* Editor de texto amplio, estilo procesador de texto */
        .ql-container { font-size: 1rem; }
        .ql-editor { min-height: 340px; max-height: 60vh; overflow-y: auto; background: #fff; }
        .ql-toolbar.ql-snow { position: sticky; top: 0; z-index: 2; background: #fff; border-radius: 4px 4px 0 0; }
        .ql-toolbar .ql-undo, .ql-toolbar .ql-redo { width: 28px; }
        /* El área de escritura queda blanca en los dos temas: así se ve el texto como en
           la web y los colores elegidos en el editor siguen siendo legibles. */
        .ql-editor { color: #212529; }
        /* Tema oscuro: la barra de herramientas del editor. */
        [data-bs-theme="dark"] .ql-toolbar.ql-snow { background: var(--bs-tertiary-bg); }
        [data-bs-theme="dark"] .ql-toolbar.ql-snow,
        [data-bs-theme="dark"] .ql-container.ql-snow,
        [data-bs-theme="dark"] .ql-snow .ql-picker.ql-expanded .ql-picker-label,
        [data-bs-theme="dark"] .ql-snow .ql-picker.ql-expanded .ql-picker-options { border-color: var(--bs-border-color); }
        [data-bs-theme="dark"] .ql-snow .ql-picker { color: var(--bs-body-color); }
        [data-bs-theme="dark"] .ql-snow .ql-picker-options { background-color: var(--bs-body-bg); }
        [data-bs-theme="dark"] .ql-snow .ql-stroke,
        [data-bs-theme="dark"] .ql-snow .ql-stroke-miter { stroke: var(--bs-body-color); }
        [data-bs-theme="dark"] .ql-snow .ql-fill,
        [data-bs-theme="dark"] .ql-snow .ql-stroke.ql-fill { fill: var(--bs-body-color); }
        /* Botón activo o bajo el cursor: azul claro, legible sobre fondo oscuro. */
        [data-bs-theme="dark"] .ql-toolbar.ql-snow :is(button:hover, button:focus, button.ql-active, .ql-picker-label:hover, .ql-picker-label.ql-active, .ql-picker-item:hover, .ql-picker-item.ql-selected) { color: #6ea8fe; }
        [data-bs-theme="dark"] .ql-toolbar.ql-snow :is(button:hover, button:focus, button.ql-active, .ql-picker-label:hover, .ql-picker-label.ql-active, .ql-picker-item:hover, .ql-picker-item.ql-selected) :is(.ql-stroke, .ql-stroke-miter) { stroke: #6ea8fe; }
        [data-bs-theme="dark"] .ql-toolbar.ql-snow :is(button:hover, button:focus, button.ql-active, .ql-picker-label:hover, .ql-picker-label.ql-active, .ql-picker-item:hover, .ql-picker-item.ql-selected) .ql-fill { fill: #6ea8fe; }
    </style>
</head>

<body>

    <!-- ==================== LOGIN ==================== -->
    <div id="vista-login">
        <div class="tarjeta-login">
            <div class="login-marca">
                <img src="assets/images/logo-blan-1-299x95.png" alt="CCI AL/Colombia" class="login-logo">
                <p>Administra el contenido del sitio: secciones, textos, imágenes, recursos y publicaciones.</p>
            </div>
            <div class="login-formulario">
                <h1 class="h4 fw-bold mb-1">Panel de administración</h1>
                <p class="text-body-secondary mb-4">Ingresa con tu cuenta de administrador.</p>
                <label class="form-label small fw-semibold" for="login-email">Correo</label>
                <input type="email" id="login-email" class="form-control mb-3" placeholder="Correo" autocomplete="username">
                <label class="form-label small fw-semibold" for="login-password">Contraseña</label>
                <input type="password" id="login-password" class="form-control mb-4" placeholder="Contraseña" autocomplete="current-password">
                <button class="btn btn-primary w-100 py-2 fw-semibold" onclick="iniciarSesion()">Ingresar</button>
                <p id="login-error" class="text-danger mt-3 mb-0" style="display:none;"></p>
            </div>
        </div>
    </div>

    <!-- ==================== PANEL ==================== -->
    <div id="vista-panel" style="display:none;">
        <div class="tablero">
            <!-- Menú lateral: lo arma construirMenu() con las tablas agrupadas (GRUPOS_MENU). -->
            <aside class="barra-lateral offcanvas-lg offcanvas-start" id="barra-lateral" tabindex="-1" aria-label="Menú del panel">
                <div class="barra-marca">
                    <div>
                        <img src="assets/images/logo-blan-1-299x95.png" alt="CCI AL/Colombia">
                        <small>Panel de administración</small>
                    </div>
                    <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                        data-bs-target="#barra-lateral" aria-label="Cerrar menú"></button>
                </div>
                <nav class="barra-cuerpo" id="menu-tablas" aria-label="Tablas del sitio"></nav>
            </aside>

            <div class="tablero-principal">
                <header class="barra-superior">
                    <button type="button" class="btn btn-outline-secondary btn-sm d-lg-none" data-bs-toggle="offcanvas"
                        data-bs-target="#barra-lateral" aria-controls="barra-lateral" aria-label="Abrir menú">
                        <i class="bi bi-list fs-5" aria-hidden="true"></i>
                    </button>
                    <div class="miga d-none d-sm-block" aria-label="Ubicación">
                        Administración <i class="bi bi-chevron-right mx-1" aria-hidden="true"></i> <span id="miga-grupo"></span>
                    </div>
                    <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
                        <div class="btn-group btn-group-sm" role="group" aria-label="Tema del panel" id="selector-tema">
                            <button type="button" class="btn btn-outline-secondary" data-tema="light" onclick="cambiarTema('light')"
                                title="Tema claro" aria-label="Tema claro" aria-pressed="false">
                                <i class="bi bi-sun" aria-hidden="true"></i><span class="d-none d-xl-inline ms-1">Claro</span>
                            </button>
                            <button type="button" class="btn btn-outline-secondary" data-tema="dark" onclick="cambiarTema('dark')"
                                title="Tema oscuro" aria-label="Tema oscuro" aria-pressed="false">
                                <i class="bi bi-moon-stars" aria-hidden="true"></i><span class="d-none d-xl-inline ms-1">Oscuro</span>
                            </button>
                            <button type="button" class="btn btn-outline-secondary" data-tema="auto" onclick="cambiarTema('auto')"
                                title="Tema del sistema (según el dispositivo)" aria-label="Tema del sistema" aria-pressed="false">
                                <i class="bi bi-circle-half" aria-hidden="true"></i><span class="d-none d-xl-inline ms-1">Sistema</span>
                            </button>
                        </div>
                        <div class="usuario d-none d-md-flex">
                            <span class="avatar"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
