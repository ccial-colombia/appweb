        let seccionesDisponibles = [];

        // Trae el catálogo de secciones desde informacion_general para poder
        // elegirlas en un desplegable con un nombre legible (página · sección).
        async function cargarSeccionesDisponibles() {
            const { data } = await supabaseClient
                .from("informacion_general")
                .select("id, clave, pagina, titulo, orden")
                .order("pagina", { ascending: true, nullsFirst: true })
                .order("orden", { ascending: true })
                .order("id", { ascending: true });
            seccionesDisponibles = data || [];
        }

        function seccionPorClave(clave) {
            return seccionesDisponibles.find(function (x) { return x.clave === clave; }) || {};
        }

        // Posición de la sección en el catálogo (para ordenar por página y sección).
        function posicionSeccion(clave) {
            const i = seccionesDisponibles.findIndex(function (x) { return x.clave === clave; });
            return i === -1 ? Number.MAX_SAFE_INTEGER : i;
        }

        // Nombre legible de una sección a partir de su clave.
        function etiquetaSeccion(clave) {
            const s = seccionPorClave(clave);
            if (!s.clave) return clave;
            return (s.pagina ? s.pagina + " · " : "") + (s.titulo || s.clave);
        }

        // Claves con un texto editable (data-contenido) en el HTML de las páginas.
        // El catálogo (informacion_general) mezcla bloques (data-seccion) y textos, y un
        // texto guardado en un bloque no se ve en la web: así el panel solo ofrece los textos.
        // Se leen las páginas de PAGINAS y las del catálogo; las que no se puedan leer
        // (ej: el panel abierto como archivo) no se filtran.
        //   { claves: Set de claves con data-contenido, paginas: Set de páginas leídas }
        let marcadoresTexto = null;
        async function cargarMarcadoresTexto() {
            const paginas = PAGINAS.slice();
            seccionesDisponibles.forEach(function (s) {
                if (s.pagina && paginas.indexOf(s.pagina) === -1) paginas.push(s.pagina);
            });
            const claves = new Set();
            const leidas = new Set();
            await Promise.all(paginas.map(async function (pagina) {
                try {
                    const respuesta = await fetch(pagina, { cache: "no-cache" });
                    if (!respuesta.ok) return;
                    // DOMParser no ejecuta los scripts de la página.
                    const documento = new DOMParser().parseFromString(await respuesta.text(), "text/html");
                    documento.querySelectorAll("[data-contenido]").forEach(function (el) {
                        claves.add(el.getAttribute("data-contenido"));
                    });
                    leidas.add(pagina);
                } catch (e) { /* página sin leer: sus secciones se muestran todas */ }
            }));
            marcadoresTexto = { claves: claves, paginas: leidas };
        }

        // Si el texto de una sección se ve en la web: true (la página tiene su data-contenido),
        // false (se leyó la página y no lo tiene) o null (no se sabe).
        function textoSeMuestra(clave) {
            if (!marcadoresTexto || !clave) return null;
            if (marcadoresTexto.claves.has(clave)) return true;
            const pagina = seccionPorClave(clave).pagina;
            // Las globales (sin página) se buscan en todas: basta con haber leído alguna.
            const leida = pagina ? marcadoresTexto.paginas.has(pagina) : marcadoresTexto.paginas.size > 0;
            return leida ? false : null;
        }

        // ==================== ESTILOS DE TÍTULOS ====================

        // Ejemplo de cada grupo para la vista previa, con su letra, tamaño (px en escritorio)
        // y color de hoy, que es lo que se ve cuando el campo queda en "Original".
        const MUESTRAS_ESTILO = {
            titulos: { texto: "Bienvenido a CampaTienda", fuente: "Jost", tamano: 44.8, color: "#045e5c" },
            subtitulos: { texto: "¡Solo para nuestra familia CCI AL!", fuente: "Inter", tamano: 22.4, color: "#232323" },
            tarjetas: { texto: "Dependencia de Dios", fuente: "Jost", tamano: 22.4, color: "#05386b" }
        };

        // Carga en el panel una letra de Google Fonts (para la vista previa), una sola vez.
        const fuentesCargadasPanel = new Set();
        function cargarFuentePanel(nombre) {
            const fuente = FUENTES_TITULOS.find(function (f) { return f.valor === nombre; });
            if (!fuente || !fuente.google || fuentesCargadasPanel.has(nombre)) return;
            fuentesCargadasPanel.add(nombre);
            const enlace = document.createElement("link");
            enlace.rel = "stylesheet";
            enlace.href = "https://fonts.googleapis.com/css2?family=" + fuente.google + "&display=swap";
            document.head.appendChild(enlace);
        }

        function familiaCssPanel(nombre) {
            const fuente = FUENTES_TITULOS.find(function (f) { return f.valor === nombre; });
            return '"' + nombre + '", ' + (fuente && fuente.serifa ? "serif" : "sans-serif");
        }

        // Valor de un campo "color": null si está marcado "Usar el color original".
        function valorColor(campo) {
            const original = document.getElementById("campo-" + campo + "-original");
            if (original && original.checked) return null;
            const control = document.getElementById("campo-" + campo);
            return control ? control.value : null;
        }

        // Vista previa del formulario de Estilos de títulos: un título de ejemplo del grupo
        // con los valores elegidos (o los de hoy, en los campos que quedan en "Original").
        function pintarVistaPreviaEstilo(contenedor, fila) {
            const muestra = MUESTRAS_ESTILO[fila && fila.clave] || MUESTRAS_ESTILO.titulos;
            const fuente = document.getElementById("campo-fuente").value || muestra.fuente;
            const porcentaje = Number(document.getElementById("campo-tamano").value);
            const factor = porcentaje >= 50 && porcentaje <= 200 ? porcentaje / 100 : 1;
            cargarFuentePanel(fuente);

            const ejemplo = document.createElement("div");
            ejemplo.className = "muestra-estilo";
            ejemplo.style.fontFamily = familiaCssPanel(fuente);
            ejemplo.style.fontSize = (muestra.tamano * factor).toFixed(1) + "px";
            ejemplo.style.color = valorColor("color") || muestra.color;
            const negrita = document.createElement("strong");
            negrita.textContent = muestra.texto;
            ejemplo.appendChild(negrita);

            const nota = document.createElement("div");
            nota.className = "nota-estilo";
            nota.textContent = "Ejemplo con el tamaño que tiene en computador (" + (muestra.tamano * factor).toFixed(0) +
                " px). En la web cada título conserva su tamaño propio, escalado con el mismo porcentaje.";
            contenedor.replaceChildren(ejemplo, nota);
        }

        // Campos "color": al elegir un color se desmarca "Usar el color original", y el
        // selector se ve atenuado mientras esa opción esté marcada.
        function prepararCamposColor(def) {
            def.campos.forEach(function (c) {
                if (c.tipo !== "color") return;
                const selector = document.getElementById("campo-" + c.campo);
                const original = document.getElementById("campo-" + c.campo + "-original");
                const caja = selector.closest(".campo-color");
                const actualizar = function () { caja.classList.toggle("usa-original", original.checked); };
                selector.addEventListener("input", function () { original.checked = false; actualizar(); });
                original.addEventListener("change", actualizar);
                actualizar();
            });
        }

        function obtenerTextoPlano(html) {
            const div = document.createElement("div");
            div.innerHTML = html || "";
            return div.textContent || "";
        }

        function escaparHtml(texto) {
            const div = document.createElement("div");
            div.textContent = texto == null ? "" : String(texto);
            return div.innerHTML;
        }

        // Fecha de hoy en Colombia (AAAA-MM-DD), la misma con la que la base decide qué anuncios mostrar.
        function hoyEnColombia() {
            return new Intl.DateTimeFormat("en-CA", {
                timeZone: "America/Bogota", year: "numeric", month: "2-digit", day: "2-digit"
            }).format(new Date());
        }

        // "2026-11-03" -> "3 nov 2026". Otros formatos se muestran tal cual.
        function formatoFecha(valor) {
            const partes = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(valor || ""));
            if (!partes) return valor;
            return new Date(Number(partes[1]), Number(partes[2]) - 1, Number(partes[3]))
                .toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
        }

        // Enlaces que acepta el menú (igual que en assets/js/secciones.js): una página del
        // sitio (pagina.html, con ?... o #... opcionales) o una dirección https:// o mailto:.
        function enlaceMenuValido(enlace) {
            return /^(https?:\/\/|mailto:)\S+$/i.test(enlace) ||
                /^[\w.\/-]+\.html?([?#]\S*)?$/i.test(enlace);
        }

        // Si un anuncio se está mostrando hoy en index.html.
        function estadoAnuncio(fila) {
            const hoy = hoyEnColombia();
            if (!fila.visible) return { texto: "Oculto", color: "warning" };
            if (fila.fecha_inicio && hoy < fila.fecha_inicio) return { texto: "Programado", color: "info" };
            if (fila.fecha_fin && hoy > fila.fecha_fin) return { texto: "Vencido", color: "secondary" };
            return { texto: "Se muestra hoy", color: "success" };
        }

        // Texto visible de una opción de un "select" (las opciones pueden ser { valor, texto }).
        function textoOpcion(c, valor) {
            const o = (c.opciones || []).find(function (x) { return typeof x === "object" && x.valor === valor; });
            return o ? o.texto : valor;
        }

        // 2516582 -> "2,4 MB"; 81920 -> "80 KB".
        function formatoTamano(bytes) {
            if (bytes == null || isNaN(bytes)) return "";
            const mb = bytes / (1024 * 1024);
            if (mb >= 1) return mb.toLocaleString("es-CO", { maximumFractionDigits: 1 }) + " MB";
            return Math.max(1, Math.round(bytes / 1024)) + " KB";
        }

        // Nombre legible de un archivo subido (sin la marca de tiempo que se le agrega al subirlo).
        function nombreDeArchivo(url) {
            let nombre = String(url || "").split("?")[0].split("/").pop();
            try { nombre = decodeURIComponent(nombre); } catch (e) { /* se deja tal cual */ }
            return nombre.replace(/^\d{10,}-/, "") || "archivo";
        }

        function esPdf(archivo) {
            return archivo.type === "application/pdf" || /\.pdf$/i.test(archivo.name);
        }

        function mostrarAlerta(mensaje) {
            const alerta = document.getElementById("alerta");
            alerta.textContent = mensaje || "";
            alerta.style.display = mensaje ? "block" : "none";
        }

        // ==================== SESIÓN ====================

        async function iniciarSesion() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            const error = document.getElementById("login-error");

            const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (err) {
                error.textContent = "Credenciales incorrectas o usuario no autorizado.";
                error.style.display = "block";
                return;
            }
            error.style.display = "none";
            mostrarPanel();
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            document.getElementById("vista-panel").style.display = "none";
            document.getElementById("vista-login").style.display = "flex";
        }

        async function mostrarPanel() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;
            document.getElementById("vista-login").style.display = "none";
            document.getElementById("vista-panel").style.display = "block";
            document.getElementById("usuario-email").textContent =
                session.user.user_metadata.display_name || session.user.email;
            await cargarSeccionesDisponibles();
            construirMenu();
            seleccionarTabla(tablaActual);
        }

        // ==================== PANEL ====================

        // Presentación del menú lateral: grupos de tablas, su ícono (Bootstrap Icons) y una
        // descripción corta que se muestra bajo el título. Solo cambia cómo se ve el panel.
        const GRUPOS_MENU = [
            { titulo: "Comunidad", tablas: ["fincas", "transporte", "cocina", "testimonios"] },
            { titulo: "Contenido", tablas: ["articulos", "cursos", "talleres", "videos", "descargables", "productos", "anuncios"] },
            { titulo: "Sitio web", tablas: ["menu", "imagenes_sitio", "informacion_general", "contenido_secciones"] },
            { titulo: "Configuración", tablas: ["estilos_titulos"] },
            { titulo: "Acceso", tablas: ["psw_change"] }
        ];
        const PRESENTACION = {
            fincas: { icono: "house-door", descripcion: "Fincas para campamentos de la página Comunidad." },
            transporte: { icono: "bus-front", descripcion: "Contactos de transporte de la página Comunidad." },
            cocina: { icono: "egg-fried", descripcion: "Contactos de cocina de la página Comunidad." },
            testimonios: { icono: "chat-quote", descripcion: "Testimonios de la página Comunidad." },
            articulos: { icono: "journal-text", descripcion: "Artículos de la revista virtual El Punto, del más nuevo al más viejo." },
            cursos: { icono: "mortarboard", descripcion: "Cursos de la página Exclusivo." },
            talleres: { icono: "tools", descripcion: "Talleres de la página Exclusivo." },
            videos: { icono: "play-btn", descripcion: "Videos exclusivos de la página Equipados." },
            descargables: { icono: "file-earmark-pdf", descripcion: "PDF de ISL y de la Enciclopedia de Juegos (página Equipados)." },
            productos: { icono: "bag", descripcion: "Catálogo de CampaTienda." },
            anuncios: { icono: "megaphone", descripcion: "Carrusel de bienvenida, con fecha de inicio y de fin." },
            menu: { icono: "menu-button-wide", descripcion: "Opciones del menú superior de las páginas." },
            imagenes_sitio: { icono: "images", descripcion: "Logo, portadas, fondos y demás imágenes fijas de las páginas." },
            informacion_general: { icono: "grid-1x2", descripcion: "Secciones de cada página: habilítalas, ocúltalas o cambia su orden." },
            contenido_secciones: { icono: "pencil-square", descripcion: "Títulos y párrafos editables de las páginas." },
            estilos_titulos: { icono: "palette", descripcion: "Tipo de letra, tamaño y color de los títulos y subtítulos de todas las páginas." },
            psw_change: { icono: "key", descripcion: "Contraseña con la que los miembros entran al sitio." }
        };

        function presentacionDe(nombre) {
            return PRESENTACION[nombre] || { icono: "table", descripcion: "" };
        }

        // Grupos del menú; las tablas que no estén en ninguno van al final, en "Otras".
        function gruposMenu() {
            const agrupadas = [].concat.apply([], GRUPOS_MENU.map(function (g) { return g.tablas; }));
            const otras = Object.keys(TABLAS).filter(function (nombre) { return agrupadas.indexOf(nombre) === -1; });
            return GRUPOS_MENU.concat(otras.length ? [{ titulo: "Otras", tablas: otras }] : []);
        }

        function grupoDe(nombre) {
            const grupo = gruposMenu().find(function (g) { return g.tablas.indexOf(nombre) !== -1; });
            return grupo ? grupo.titulo : "";
        }

        // Menú lateral. En celulares el menú se cierra al elegir una tabla (data-bs-dismiss).
        function construirMenu() {
            document.getElementById("menu-tablas").innerHTML = gruposMenu().map(function (g) {
                const enlaces = g.tablas.filter(function (nombre) { return TABLAS[nombre]; }).map(function (nombre) {
                    return '<a class="nav-link' + (nombre === tablaActual ? " active" : "") + '" data-tabla="' + nombre + '"' +
                        ' data-bs-dismiss="offcanvas" data-bs-target="#barra-lateral"' +
                        ' onclick="seleccionarTabla(\'' + nombre + '\')">' +
                        '<i class="bi bi-' + presentacionDe(nombre).icono + '" aria-hidden="true"></i>' +
                        "<span>" + escaparHtml(TABLAS[nombre].titulo) + "</span></a>";
                }).join("");
                return enlaces ? '<div class="grupo-menu">' + escaparHtml(g.titulo) + "</div>" + enlaces : "";
            }).join("");
        }

        // Encabezado de la tabla elegida: grupo, descripción y tarjetas de resumen (vacías hasta que cargue).
        function pintarEncabezado(nombre) {
            const grupo = grupoDe(nombre);
            document.getElementById("grupo-tabla").textContent = grupo;
            document.getElementById("miga-grupo").textContent = grupo ? grupo + " · " + TABLAS[nombre].titulo : TABLAS[nombre].titulo;
            document.getElementById("descripcion-tabla").textContent = presentacionDe(nombre).descripcion;
            pintarResumen(TABLAS[nombre], null);
        }

        // Tarjetas de resumen: registros y, si la tabla los tiene, visibles, ocultos y páginas.
        // Cuentan las filas que deja ver el filtro por página. Sin datos (cargando) muestran "–".
        function pintarResumen(def, data) {
            const total = (cargarDatos.filas || []).length;
            const valor = function (n) { return data ? n : "–"; };
            const tarjetas = [{
                icono: "collection", color: "azul", texto: "Registros", valor: valor(data && data.length),
                detalle: data && data.length !== total ? "de " + total : ""
            }];
            if (def.campos.some(function (c) { return c.campo === "visible"; })) {
                const visibles = data ? data.filter(function (f) { return f.visible; }).length : 0;
                tarjetas.push({ icono: "eye", color: "verde", texto: "Visibles", valor: valor(visibles) });
                tarjetas.push({ icono: "eye-slash", color: "gris", texto: "Ocultos", valor: valor(data && data.length - visibles) });
            }
            if (def.paginaDeFila || def.campos.some(function (c) { return c.campo === "pagina"; })) {
                const paginas = new Set((data ? cargarDatos.filas : []).map(valorFiltro)
                    .filter(function (v) { return v !== "-"; }));
                tarjetas.push({ icono: "files", color: "turquesa", texto: "Páginas", valor: valor(paginas.size) });
            }
            document.getElementById("resumen-tabla").innerHTML = tarjetas.map(function (t) {
                return '<div class="col-6 col-md-3"><div class="tarjeta tarjeta-resumen">' +
                    '<span class="icono ' + t.color + '"><i class="bi bi-' + t.icono + '" aria-hidden="true"></i></span>' +
                    '<div><div class="valor">' + escaparHtml(t.valor) + "</div>" +
                    '<div class="texto">' + escaparHtml(t.texto) + (t.detalle ? " " + escaparHtml(t.detalle) : "") + "</div></div>" +
                    "</div></div>";
            }).join("");
        }

        function seleccionarTabla(nombre) {
            tablaActual = nombre;
            document.querySelectorAll("#menu-tablas .nav-link").forEach(function (enlace) {
                enlace.classList.toggle("active", enlace.dataset.tabla === nombre);
            });
            document.getElementById("titulo-tabla").textContent = TABLAS[nombre].titulo;
            pintarEncabezado(nombre);
            // Tablas "solo editar": sus filas las crea un script SQL y no se agregan ni eliminan aquí.
            document.getElementById("btn-agregar").style.display = TABLAS[nombre].soloEditar ? "none" : "";
            cargarDatos();
        }

        function vacio(valor) {
            return valor == null || valor === "";
        }

        async function cargarDatos() {
            const def = TABLAS[tablaActual];
            const tablaPedida = tablaActual;
            mostrarAlerta("");

            // Orden: el que defina la tabla o, si no, página y orden cuando existan.
            // Con "descendente" va de mayor a menor (ej: artículos, del más nuevo al más viejo).
            const ascendente = !def.descendente;
            const columnas = def.ordenarPor || def.campos
                .map(function (c) { return c.campo; })
                .filter(function (campo) { return campo === "pagina" || campo === "orden"; });
            let consulta = supabaseClient.from(tablaActual).select("*");
            columnas.forEach(function (columna) {
                consulta = consulta.order(columna, { ascending: ascendente, nullsFirst: !!def.nulosPrimero });
            });
            consulta = consulta.order(def.pk, { ascending: ascendente });

            // Las tablas que se filtran por la página de su sección (Contenido de secciones)
            // necesitan el catálogo al día y saber qué textos están en las páginas.
            const catalogo = def.paginaDeFila ? cargarSeccionesDisponibles().then(cargarMarcadoresTexto) : null;
            const { data, error } = await consulta;
            await catalogo;
            // Si se cambió de pestaña mientras cargaba, esta respuesta ya no sirve.
            if (tablaPedida !== tablaActual) return;
            if (error) {
                // Tabla nueva cuyo script SQL aún no se ejecutó (ej: estilos_titulos).
                const sinTabla = error.code === "PGRST205" || error.code === "42P01";
                mostrarAlerta(sinTabla
                    ? 'La tabla "' + tablaActual + '" todavía no existe en Supabase: ejecuta su script de la carpeta supabase/ (ver supabase/README.md).'
                    : "Error al cargar los datos: " + error.message);
                cargarDatos.filas = [];
            } else {
                cargarDatos.filas = data || [];
                if (def.ordenarFilas) cargarDatos.filas.sort(def.ordenarFilas);
            }
            prepararFiltroPagina();
            pintarFilas();
        }

        // Página de una fila para el filtro ("-" = sin página): la columna "pagina"
        // o, si la tabla no la tiene, la que indique su definición (paginaDeFila).
        function valorFiltro(fila) {
            const def = TABLAS[tablaActual];
            const pagina = def.paginaDeFila ? def.paginaDeFila(fila) : fila.pagina;
            return vacio(pagina) ? "-" : pagina;
        }

        // Muestra el filtro por página en las tablas que tienen esa columna.
        function prepararFiltroPagina() {
            const def = TABLAS[tablaActual];
            const filtro = document.getElementById("filtro-pagina");
            const campoPagina = def.campos.find(function (c) { return c.campo === "pagina"; }) ||
                (def.paginaDeFila ? { textoVacio: def.textoSinPagina } : null);
            if (!campoPagina) {
                filtro.style.display = "none";
                return;
            }
            const anterior = filtro.dataset.tabla === tablaActual ? filtro.value : "*";
            const valores = [];
            cargarDatos.filas.forEach(function (fila) {
                const v = valorFiltro(fila);
                if (valores.indexOf(v) === -1) valores.push(v);
            });
            filtro.innerHTML = '<option value="*">Todas las páginas</option>' + valores.map(function (v) {
                const texto = v === "-" ? (campoPagina.textoVacio || "Sin página") : v;
                return '<option value="' + escaparHtml(v) + '">' + escaparHtml(texto) + "</option>";
            }).join("");
            filtro.value = valores.indexOf(anterior) !== -1 ? anterior : "*";
            filtro.dataset.tabla = tablaActual;
            filtro.style.display = "";
        }

        function pintarFilas() {
            const def = TABLAS[tablaActual];
            const filtro = document.getElementById("filtro-pagina");
            const filtroActivo = filtro.style.display === "none" ? "*" : filtro.value;
            const data = (cargarDatos.filas || []).filter(function (fila) {
                return filtroActivo === "*" || valorFiltro(fila) === filtroActivo;
            });

            // Campos con ocultarEnTabla solo aparecen en el formulario (para que la tabla quepa).
            const columnas = def.campos.filter(function (c) { return !c.ocultarEnTabla; });

            document.getElementById("thead-datos").innerHTML = "<tr>" +
                columnas.map(function (c) { return "<th>" + escaparHtml(c.etiqueta) + "</th>"; }).join("") +
                '<th class="text-end">Acciones</th></tr>';

            pintarResumen(def, data);

            const tbody = document.getElementById("tbody-datos");
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="' + (columnas.length + 1) +
                    '" class="estado-vacio"><i class="bi bi-inbox" aria-hidden="true"></i>No hay registros.' +
                    (def.soloEditar ? "" : ' Usa "+ Agregar".') + "</td></tr>";
                return;
            }

            tbody.innerHTML = data.map(function (fila, posicion) {
                const celdas = columnas.map(function (c) {
                    const valor = fila[c.campo];
                    // Columna calculada (no es un campo de la tabla): una etiqueta de color.
                    if (c.tipo === "estado") {
                        const estado = c.estado(fila);
                        return '<td class="text-nowrap"><span class="badge rounded-pill text-' + estado.color + "-emphasis bg-" +
                            estado.color + '-subtle">' + escaparHtml(estado.texto) + "</span></td>";
                    }
                    if (c.tipo === "date" && !vacio(valor)) {
                        return '<td class="text-nowrap">' + escaparHtml(formatoFecha(valor)) + "</td>";
                    }
                    if (c.tipo === "checkbox") {
                        return '<td><span class="badge rounded-pill ' +
                            (valor ? "text-success-emphasis bg-success-subtle" : "text-secondary-emphasis bg-secondary-subtle") + '">' +
                            (valor ? "Sí" : "No") + "</span></td>";
                    }
                    if (c.tipo === "image") {
                        if (vacio(valor)) return '<td class="text-muted">' + escaparHtml(c.textoVacio || "Sin foto") + "</td>";
                        return c.forma === "rectangular"
                            ? '<td><img src="' + escaparHtml(valor) + '" alt="Imagen" class="miniatura-rect" loading="lazy"></td>'
                            : '<td><img src="' + escaparHtml(valor) + '" alt="Foto" style="width:40px;height:40px;object-fit:cover;border-radius:50%;"></td>';
                    }
                    if (c.tipo === "archivo") {
                        if (vacio(valor)) return '<td class="text-muted">Sin archivo</td>';
                        const tamano = c.campoTamano ? formatoTamano(fila[c.campoTamano]) : "";
                        return '<td class="text-nowrap"><a href="' + escaparHtml(valor) + '" target="_blank" rel="noopener">Ver PDF</a>' +
                            (tamano ? ' <span class="text-muted small">' + escaparHtml(tamano) + "</span>" : "") + "</td>";
                    }
                    if (vacio(valor) && c.textoVacio) {
                        return '<td class="text-muted">' + escaparHtml(c.textoVacio) + "</td>";
                    }
                    if (c.tipo === "color") {
                        // Solo #rrggbb llega al atributo style (la tabla también lo exige).
                        const muestra = /^#[0-9a-f]{6}$/i.test(valor)
                            ? '<span class="muestra-color" style="background:' + valor + '"></span>' : "";
                        return '<td class="text-nowrap">' + muestra + escaparHtml(valor) + "</td>";
                    }
                    if (c.formato && !vacio(valor)) {
                        return '<td class="text-nowrap">' + escaparHtml(c.formato(valor)) + "</td>";
                    }
                    if (c.tipo === "select" && c.opciones) {
                        const texto = textoOpcion(c, valor);
                        return '<td class="celda-texto" title="' + escaparHtml(texto) + '">' + escaparHtml(texto) + "</td>";
                    }
                    if (c.tipo === "richtext") {
                        const textoPlano = obtenerTextoPlano(valor);
                        return '<td class="celda-texto" title="' + escaparHtml(textoPlano) + '">' + escaparHtml(textoPlano) + "</td>";
                    }
                    if (c.tipo === "select" && c.opcionesDinamicas === "secciones") {
                        const texto = etiquetaSeccion(valor);
                        // Texto guardado en una sección que no tiene dónde mostrarlo en la página.
                        const aviso = textoSeMuestra(valor) === false
                            ? '<span class="badge rounded-pill text-warning-emphasis bg-warning-subtle me-1" title="La página no tiene un texto editable con esta clave: este texto no aparece en la web. Puedes eliminarlo.">No se ve en la web</span>'
                            : "";
                        return '<td class="celda-texto" title="' + escaparHtml(texto) + '">' + aviso + escaparHtml(texto) + "</td>";
                    }
                    return '<td class="celda-texto" title="' + escaparHtml(valor) + '">' + escaparHtml(valor) + "</td>";
                }).join("");
                // Tablas con "reordenar": flechas para subir o bajar la fila (ej: Menú).
                const flechas = def.reordenar
                    ? '<div class="btn-group btn-group-sm me-1" role="group" aria-label="Cambiar el orden">' +
                      '<button class="btn btn-outline-secondary" title="Subir" aria-label="Subir" onclick="moverFila(' + fila[def.pk] + ', -1)"' +
                      (posicion === 0 ? " disabled" : "") + '><i class="bi bi-arrow-up" aria-hidden="true"></i></button>' +
                      '<button class="btn btn-outline-secondary" title="Bajar" aria-label="Bajar" onclick="moverFila(' + fila[def.pk] + ', 1)"' +
                      (posicion === data.length - 1 ? " disabled" : "") + '><i class="bi bi-arrow-down" aria-hidden="true"></i></button></div>'
                    : "";
                return "<tr>" + celdas +
                    '<td class="text-end text-nowrap">' + flechas +
                    '<button class="btn btn-outline-primary btn-sm me-1" onclick="abrirFormulario(' + fila[def.pk] + ')">' +
                    '<i class="bi bi-pencil me-1" aria-hidden="true"></i>Editar</button>' +
                    (def.soloEditar ? "" :
                        '<button class="btn btn-outline-danger btn-sm" onclick="eliminar(' + fila[def.pk] + ')">' +
                        '<i class="bi bi-trash me-1" aria-hidden="true"></i>Eliminar</button>') +
                    "</td></tr>";
            }).join("");
        }

        // ==================== AGREGAR / EDITAR / ELIMINAR ====================

        async function abrirFormulario(pkValor) {
            const def = TABLAS[tablaActual];
            filaEditando = pkValor == null ? null :
                (cargarDatos.filas || []).find(function (f) { return f[def.pk] === pkValor; });

            // Refresca la lista de secciones si el formulario tiene un selector dinámico.
            if (def.campos.some(function (c) { return c.opcionesDinamicas === "secciones"; })) {
                await cargarSeccionesDisponibles();
            }

            document.getElementById("modal-titulo").textContent =
                (filaEditando ? "Editar" : "Agregar") + " — " + def.titulo;
            document.getElementById("modal-error").style.display = "none";

            // Calcular siguiente orden disponible cuando se está agregando
            let siguienteOrden = null;
            if (!filaEditando) {
                const filasExistentes = cargarDatos.filas || [];
                if (def.campos.some(function (x) { return x.campo === "orden"; })) {
                    let maxOrden = 0;
                    filasExistentes.forEach(function (f) {
                        const o = Number(f.orden);
                        if (!isNaN(o) && o > maxOrden) maxOrden = o;
                    });
                    siguienteOrden = maxOrden + 1;
                }
            }

            document.getElementById("modal-campos").innerHTML = def.campos.map(function (c) {
                if (c.tipo === "estado") return ""; // solo se ve en la tabla
                let valor = null;
                if (filaEditando) valor = filaEditando[c.campo];
                else if (c.campo === "orden" && siguienteOrden != null) valor = siguienteOrden;
                else if (c.porDefecto) valor = c.porDefecto();
                // Texto de ayuda opcional debajo del campo.
                const ayuda = c.ayuda ? '<div class="form-text">' + escaparHtml(c.ayuda) + "</div>" : "";
                if (c.tipo === "checkbox") {
                    return '<div class="form-check form-switch mb-3">' +
                        '<input class="form-check-input" type="checkbox" id="campo-' + c.campo + '"' +
                        ((filaEditando ? valor : c.marcadoPorDefecto !== false) ? " checked" : "") + '>' +
                        '<label class="form-check-label" for="campo-' + c.campo + '">' + escaparHtml(c.etiqueta) + "</label>" + ayuda + "</div>";
                }
                const etiqueta = '<label class="form-label" for="campo-' + c.campo + '">' + escaparHtml(c.etiqueta) +
                    (c.requerido ? ' <span class="text-danger">*</span>' : "") + "</label>";
                // Campo informativo: se muestra pero no se edita ni se guarda.
                if (c.soloLectura) {
                    const texto = vacio(valor) ? (c.textoVacio || "") : valor;
                    if (c.tipo === "textarea") {
                        return '<div class="mb-3">' + etiqueta +
                            '<textarea class="form-control" rows="2" id="campo-' + c.campo + '" disabled>' + escaparHtml(texto) + "</textarea>" +
                            ayuda + "</div>";
                    }
                    return '<div class="mb-3">' + etiqueta +
                        '<input class="form-control" type="text" id="campo-' + c.campo + '" value="' + escaparHtml(texto) + '" disabled>' +
                        ayuda + "</div>";
                }
                if (c.tipo === "textarea") {
                    return '<div class="mb-3">' + etiqueta +
                        '<textarea class="form-control" rows="4" id="campo-' + c.campo + '">' + escaparHtml(valor) + "</textarea>" + ayuda + "</div>";
                }
                if (c.tipo === "image") {
                    return '<div class="mb-3">' + etiqueta +
                        (valor
                            ? '<div class="mb-2"><img src="' + escaparHtml(valor) + '" alt="Foto actual" ' +
                              (c.forma === "rectangular"
                                  ? 'class="vista-previa-rect"'
                                  : 'style="max-height:120px;border-radius:8px;display:block;"') + "></div>"
                            : "") +
                        '<input class="form-control" type="file" accept="image/*" id="campo-' + c.campo + '">' +
                        (valor && !c.requerido
                            ? '<div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="campo-' + c.campo + '-quitar">' +
                              '<label class="form-check-label" for="campo-' + c.campo + '-quitar">Quitar foto actual</label></div>'
                            : "") +
                        ayuda + "</div>";
                }
                if (c.tipo === "archivo") {
                    const tamanoActual = filaEditando && c.campoTamano ? formatoTamano(filaEditando[c.campoTamano]) : "";
                    return '<div class="mb-3">' + etiqueta +
                        (valor
                            ? '<div class="mb-2 small">Archivo actual: <a href="' + escaparHtml(valor) + '" target="_blank" rel="noopener">' +
                              escaparHtml(nombreDeArchivo(valor)) + "</a>" +
                              (tamanoActual ? ' <span class="text-muted">(' + escaparHtml(tamanoActual) + ")</span>" : "") + "</div>"
                            : "") +
                        '<input class="form-control" type="file"' + (c.soloPdf ? ' accept=".pdf,application/pdf"' : "") +
                        ' id="campo-' + c.campo + '">' + ayuda + "</div>";
                }
                if (c.tipo === "richtext") {
                    return '<div class="mb-3">' + etiqueta +
                        '<div id="campo-' + c.campo + '"></div>' + ayuda + "</div>";
                }
                // Color: selector + "Usar el color original" (vacío en la tabla). Ver prepararCamposColor().
                if (c.tipo === "color") {
                    const usaOriginal = !/^#[0-9a-f]{6}$/i.test(valor || "");
                    return '<div class="mb-3">' + etiqueta +
                        '<div class="campo-color d-flex align-items-center gap-3 flex-wrap">' +
                        '<input class="form-control form-control-color" type="color" id="campo-' + c.campo + '" value="' +
                        escaparHtml(usaOriginal ? (c.colorInicial || "#000000") : valor.toLowerCase()) + '" title="Elegir color">' +
                        '<div class="form-check mb-0"><input class="form-check-input" type="checkbox" id="campo-' + c.campo + '-original"' +
                        (usaOriginal ? " checked" : "") + '>' +
                        '<label class="form-check-label" for="campo-' + c.campo + '-original">Usar el color original</label></div>' +
                        "</div>" + ayuda + "</div>";
                }
                if (c.tipo === "select") {
                    const opcion = function (o) {
                        return '<option value="' + escaparHtml(o.valor) + '"' +
                            (o.valor === valor ? " selected" : "") + ">" + escaparHtml(o.texto) + "</option>";
                    };
                    let opciones;
                    if (c.opcionesDinamicas === "secciones") {
                        // Agrupadas por página para encontrarlas fácil en una lista larga.
                        const grupos = [];
                        seccionesDisponibles.forEach(function (s) {
                            // Solo las secciones cuyo texto se ve en la web (y la de la fila que se edita).
                            if (textoSeMuestra(s.clave) === false && s.clave !== valor) return;
                            const nombre = s.pagina || "Global (todas las páginas)";
                            let grupo = grupos.find(function (g) { return g.nombre === nombre; });
                            if (!grupo) grupos.push(grupo = { nombre: nombre, opciones: [] });
                            grupo.opciones.push({ valor: s.clave, texto: s.titulo || s.clave });
                        });
                        opciones = grupos.map(function (g) {
                            return '<optgroup label="' + escaparHtml(g.nombre) + '">' + g.opciones.map(opcion).join("") + "</optgroup>";
                        }).join("");
                    } else {
                        opciones = (c.opciones || []).map(function (o) {
                            return opcion(typeof o === "object" ? o : { valor: o, texto: o });
                        }).join("");
                    }
                    const placeholder = c.placeholder || "— Seleccionar —";
                    return '<div class="mb-3">' + etiqueta +
                        '<select class="form-select" id="campo-' + c.campo + '">' +
                        '<option value="">' + escaparHtml(placeholder) + "</option>" + opciones + "</select>" +
                        (def.claveUnica === c.campo && !filaEditando
                            ? '<div class="form-text text-primary-emphasis fw-semibold" id="aviso-clave-unica" hidden></div>'
                            : "") +
                        ayuda + "</div>";
                }
                // "sugerencias": valores que el navegador ofrece al escribir (se puede escribir otro).
                const sugerencias = c.sugerencias
                    ? '<datalist id="sugerencias-' + c.campo + '">' + c.sugerencias.map(function (s) {
                          return '<option value="' + escaparHtml(s) + '">';
                      }).join("") + "</datalist>"
                    : "";
                return '<div class="mb-3">' + etiqueta +
                    '<input class="form-control" type="' + c.tipo + '" id="campo-' + c.campo +
                    '" value="' + escaparHtml(valor) + '"' +
                    (c.tipo === "number"
                        ? ' min="' + (c.min != null ? c.min : 0) + '"' + (c.max != null ? ' max="' + c.max + '"' : "") +
                          (c.paso ? ' step="' + c.paso + '"' : "")
                        : "") +
                    (c.sugerencias ? ' list="sugerencias-' + c.campo + '" autocomplete="off"' : "") + ">" +
                    sugerencias + ayuda + "</div>";
            }).join("");

            // Modal más ancho cuando el formulario tiene un editor de texto.
            const tieneRichtext = def.campos.some(function (c) { return c.tipo === "richtext"; });
            document.getElementById("modal-dialog").className =
                "modal-dialog" + (tieneRichtext ? " modal-lg modal-dialog-scrollable" : "");

            editoresRichText = {};
            def.campos.forEach(function (c) {
                if (c.tipo !== "richtext") return;
                const instancia = crearEditor("#campo-" + c.campo);
                const valorInicial = filaEditando ? filaEditando[c.campo] : null;
                if (valorInicial) instancia.root.innerHTML = valorInicial;
                editoresRichText[c.campo] = instancia;
            });

            if (def.claveUnica && !filaEditando) prepararClaveUnica(def);
            prepararCamposColor(def);

            // Vista previa en vivo (ej: Estilos de títulos): se vuelve a pintar con cada cambio.
            const camposModal = document.getElementById("modal-campos");
            if (def.vistaPrevia) {
                camposModal.insertAdjacentHTML("beforeend",
                    '<div class="mb-1"><div class="form-label">Vista previa</div><div id="vista-previa" class="vista-previa-estilo"></div></div>');
                const pintar = function () { def.vistaPrevia(document.getElementById("vista-previa"), filaEditando); };
                camposModal.oninput = pintar;
                camposModal.onchange = pintar;
                pintar();
            } else {
                camposModal.oninput = null;
                camposModal.onchange = null;
            }

            modalEdicion.show();
        }

        // Tablas con un solo registro por clave (ej: un texto por sección). Al agregar, si se
        // elige una clave que ya tiene registro, el formulario pasa a editar ese registro en
        // vez de fallar al guardar por la clave repetida:
        //   - con el editor vacío, se carga el texto guardado para modificarlo;
        //   - si ya se había escrito algo, se conserva y se avisa que reemplaza al guardado.
        // Si luego se elige otra clave sin registro, vuelve a "Agregar" (y quita el texto
        // cargado si no se cambió).
        function prepararClaveUnica(def) {
            const selector = document.getElementById("campo-" + def.claveUnica);
            const aviso = document.getElementById("aviso-clave-unica");
            const titulo = document.getElementById("modal-titulo");
            const campos = def.campos.filter(function (c) { return c.tipo === "richtext"; })
                .map(function (c) { return c.campo; });
            let cargado = null; // { campo: html } del registro que se cargó en los editores

            selector.addEventListener("change", function () {
                const existente = (cargarDatos.filas || []).find(function (f) {
                    return f[def.claveUnica] === selector.value;
                });
                // Sin cambios = editores vacíos o con el texto que se cargó tal cual.
                const sinCambios = campos.every(function (campo) {
                    const editor = editoresRichText[campo];
                    return editor.getText().trim() === "" || (cargado && editor.root.innerHTML === cargado[campo]);
                });

                if (existente) {
                    filaEditando = existente;
                    titulo.textContent = "Editar — " + def.titulo;
                    if (sinCambios) {
                        cargado = {};
                        campos.forEach(function (campo) {
                            const editor = editoresRichText[campo];
                            editor.root.innerHTML = existente[campo] || "";
                            editor.update("silent"); // sincroniza el editor con el HTML puesto
                            editor.history.clear();
                            cargado[campo] = editor.root.innerHTML;
                        });
                        aviso.textContent = "Esta sección ya tenía texto: se cargó para que lo modifiques.";
                    } else {
                        aviso.textContent = "Esta sección ya tiene texto: al guardar se reemplaza por el que escribiste.";
                    }
                    aviso.hidden = false;
                } else {
                    filaEditando = null;
                    titulo.textContent = "Agregar — " + def.titulo;
                    if (cargado && sinCambios) {
                        campos.forEach(function (campo) { editoresRichText[campo].setText(""); });
                    }
                    cargado = null;
                    aviso.hidden = true;
                }
            });
        }

        // Registra íconos de deshacer/rehacer una sola vez para el editor.
        (function registrarIconosEditor() {
            const iconos = Quill.import("ui/icons");
            iconos["undo"] =
                '<svg viewbox="0 0 18 18"><polygon class="ql-fill ql-stroke" points="6 10 4 12 2 10 6 10"></polygon>' +
                '<path class="ql-stroke" d="M8.09,13.91A4.6,4.6,0,0,0,9,14,5,5,0,1,0,4,9"></path></svg>';
            iconos["redo"] =
                '<svg viewbox="0 0 18 18"><polygon class="ql-fill ql-stroke" points="12 10 14 12 16 10 12 10"></polygon>' +
                '<path class="ql-stroke" d="M9.91,13.91A4.6,4.6,0,0,1,9,14,5,5,0,1,1,14,9"></path></svg>';
        })();

        // Editor de texto amplio (estilo procesador de texto).
        function crearEditor(selector) {
            return new Quill(selector, {
                theme: "snow",
                placeholder: "Escribe aquí...",
                modules: {
                    history: { delay: 800, maxStack: 200, userOnly: true },
                    toolbar: {
                        container: [
                            ["undo", "redo"],
                            [{ header: [1, 2, 3, 4, false] }],
                            [{ size: ["small", false, "large", "huge"] }],
                            ["bold", "italic", "underline", "strike"],
                            [{ color: [] }, { background: [] }],
                            [{ align: [] }],
                            [{ list: "ordered" }, { list: "bullet" }],
                            [{ indent: "-1" }, { indent: "+1" }],
                            ["blockquote", "link"],
                            ["clean"]
                        ],
                        handlers: {
                            undo: function () { this.quill.history.undo(); },
                            redo: function () { this.quill.history.redo(); }
                        }
                    }
                }
            });
        }

        // Reduce las fotos grandes antes de subirlas (máximo 1600 px por lado, en WebP)
        // para que las páginas carguen rápido aunque la foto venga de un celular.
        // Si algo falla, o el navegador no genera WebP, se sube la foto original.
        async function reducirImagen(archivo) {
            const LADO_MAX = 1600;
            if (!archivo || !/^image\/(jpeg|png|webp)$/.test(archivo.type)) return archivo;
            const url = URL.createObjectURL(archivo);
            try {
                const img = new Image();
                img.src = url;
                await img.decode();
                const escala = Math.min(1, LADO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
                if (escala === 1 && archivo.size <= 400 * 1024) return archivo;
                const lienzo = document.createElement("canvas");
                lienzo.width = Math.round(img.naturalWidth * escala);
                lienzo.height = Math.round(img.naturalHeight * escala);
                lienzo.getContext("2d").drawImage(img, 0, 0, lienzo.width, lienzo.height);
                const blob = await new Promise(function (resolver) { lienzo.toBlob(resolver, "image/webp", 0.82); });
                if (!blob || blob.type !== "image/webp" || blob.size >= archivo.size) return archivo;
                return new File([blob], archivo.name.replace(/\.[^.]*$/, "") + ".webp", { type: "image/webp" });
            } catch (e) {
                return archivo;
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        // Evita guardar dos veces si se hace doble clic (crearía registros duplicados).
        async function guardar() {
            const boton = document.getElementById("btn-guardar");
            if (boton.disabled) return;
            boton.disabled = true;
            try {
                await guardarRegistro();
            } finally {
                boton.disabled = false;
                boton.textContent = "Guardar"; // por si se cambió a "Subiendo…"
            }
        }

        // Mensaje claro cuando Supabase rechaza un archivo.
        function mensajeErrorSubida(error) {
            const texto = (error && error.message) || "";
            if (/maximum allowed size|too large|payload/i.test(texto) || String(error && error.statusCode) === "413") {
                return "El archivo es demasiado grande para Supabase (máximo 50 MB en el plan gratuito).";
            }
            if (/mime type/i.test(texto)) return "Tipo de archivo no permitido: solo se aceptan PDF.";
            return "Error al subir el archivo: " + texto;
        }

        async function guardarRegistro() {
            const def = TABLAS[tablaActual];
            const registro = {};
            const errorModal = document.getElementById("modal-error");

            // Validación propia de la tabla (ej: fechas de los anuncios), antes de subir archivos.
            if (def.validar) {
                const mensaje = def.validar(function (campo) {
                    const control = document.getElementById("campo-" + campo);
                    return control ? control.value.trim() : "";
                });
                if (mensaje) {
                    errorModal.textContent = mensaje;
                    errorModal.style.display = "inline";
                    return;
                }
            }

            for (const c of def.campos) {
                if (c.soloLectura || c.tipo === "estado") continue; // no se envía: no cambia o no es un campo

                if (c.tipo === "image") {
                    const inputArchivo = document.getElementById("campo-" + c.campo);
                    const checkboxQuitar = document.getElementById("campo-" + c.campo + "-quitar");
                    const archivo = await reducirImagen(inputArchivo.files[0]);

                    if (archivo) {
                        const rutaArchivo = tablaActual + "/" + Date.now() + "-" +
                            archivo.name.replace(/[^a-zA-Z0-9_.-]/g, "_");
                        const { error: errorSubida } = await supabaseClient.storage
                            .from(c.bucket).upload(rutaArchivo, archivo, { upsert: true });
                        if (errorSubida) {
                            errorModal.textContent = "Error al subir la foto: " + errorSubida.message;
                            errorModal.style.display = "inline";
                            return;
                        }
                        const { data: urlData } = supabaseClient.storage.from(c.bucket).getPublicUrl(rutaArchivo);
                        registro[c.campo] = urlData.publicUrl;
                    } else if (checkboxQuitar && checkboxQuitar.checked) {
                        registro[c.campo] = null;
                    } else if (filaEditando) {
                        registro[c.campo] = filaEditando[c.campo];
                    } else {
                        registro[c.campo] = null;
                    }
                    if (c.requerido && vacio(registro[c.campo])) {
                        errorModal.textContent = 'El campo "' + c.etiqueta + '" es obligatorio.';
                        errorModal.style.display = "inline";
                        return;
                    }
                    continue;
                }

                // Documento (PDF): se sube al bucket y se guarda su URL pública y su tamaño.
                if (c.tipo === "archivo") {
                    const archivo = document.getElementById("campo-" + c.campo).files[0];
                    if (archivo) {
                        if (c.soloPdf && !esPdf(archivo)) {
                            errorModal.textContent = 'El campo "' + c.etiqueta + '" solo acepta archivos PDF.';
                            errorModal.style.display = "inline";
                            return;
                        }
                        // El bucket solo admite application/pdf: se fija el tipo aunque el navegador no lo informe.
                        const cuerpo = c.soloPdf && archivo.type !== "application/pdf"
                            ? new File([archivo], archivo.name, { type: "application/pdf" })
                            : archivo;
                        const rutaArchivo = tablaActual + "/" + Date.now() + "-" +
                            archivo.name.replace(/[^a-zA-Z0-9_.-]/g, "_");
                        document.getElementById("btn-guardar").textContent = "Subiendo…";
                        const { error: errorSubida } = await supabaseClient.storage
                            .from(c.bucket).upload(rutaArchivo, cuerpo, { contentType: cuerpo.type || undefined });
                        if (errorSubida) {
                            errorModal.textContent = mensajeErrorSubida(errorSubida);
                            errorModal.style.display = "inline";
                            return;
                        }
                        const { data: urlData } = supabaseClient.storage.from(c.bucket).getPublicUrl(rutaArchivo);
                        registro[c.campo] = urlData.publicUrl;
                        if (c.campoTamano) registro[c.campoTamano] = archivo.size;
                    } else if (filaEditando && !vacio(filaEditando[c.campo])) {
                        registro[c.campo] = filaEditando[c.campo];
                    } else if (c.requerido) {
                        errorModal.textContent = 'El campo "' + c.etiqueta + '" es obligatorio.';
                        errorModal.style.display = "inline";
                        return;
                    } else {
                        registro[c.campo] = null;
                    }
                    continue;
                }

                if (c.tipo === "richtext") {
                    const instancia = editoresRichText[c.campo];
                    const textoPlano = instancia.getText().trim();
                    if (c.requerido && textoPlano === "") {
                        errorModal.textContent = 'El campo "' + c.etiqueta + '" es obligatorio.';
                        errorModal.style.display = "inline";
                        return;
                    }
                    registro[c.campo] = textoPlano === "" ? null : instancia.root.innerHTML;
                    continue;
                }

                if (c.tipo === "color") {
                    registro[c.campo] = valorColor(c.campo);
                    continue;
                }

                const control = document.getElementById("campo-" + c.campo);
                let valor;
                if (c.tipo === "checkbox") {
                    valor = control.checked;
                } else {
                    valor = control.value.trim();
                    if (valor === "") valor = null;
                    if (c.tipo === "number" && valor !== null) valor = Number(valor);
                }
                if (c.requerido && (valor === null || valor === "")) {
                    errorModal.textContent = 'El campo "' + c.etiqueta + '" es obligatorio.';
                    errorModal.style.display = "inline";
                    return;
                }
                registro[c.campo] = valor;
            }

            const consulta = filaEditando
                ? supabaseClient.from(tablaActual).update(registro).eq(def.pk, filaEditando[def.pk])
                : supabaseClient.from(tablaActual).insert(registro);

            const { error } = await consulta;
            if (error) {
                errorModal.textContent = "Error al guardar: " + mensajeErrorBase(error);
                errorModal.style.display = "inline";
                return;
            }
            modalEdicion.hide();
            cargarDatos();
        }

        // Mensaje claro para los errores de la base más comunes al guardar o eliminar.
        function mensajeErrorBase(error) {
            const def = TABLAS[tablaActual];
            if (error.code === "23505") { // valor repetido en una columna única (ej: la clave)
                return def.mensajeRepetido || 'Ya existe un registro con ese valor. Búscalo en la lista y usa "Editar".';
            }
            if (error.code === "23503") { // otra tabla depende de este valor
                return 'Otros datos dependen de esta clave (por ejemplo, un texto en "Contenido de secciones"). ' +
                    "Revisa la clave o elimina primero esos datos.";
            }
            return error.message;
        }

        // Sube (paso -1) o baja (paso 1) una fila en la lista y guarda el nuevo orden:
        // renumera las filas 1, 2, 3... y actualiza solo las que cambian.
        let moviendoFila = false;
        async function moverFila(pkValor, paso) {
            const def = TABLAS[tablaActual];
            if (moviendoFila) return; // evita clics repetidos mientras se guarda
            const filas = (cargarDatos.filas || []).slice();
            const desde = filas.findIndex(function (f) { return f[def.pk] === pkValor; });
            const hasta = desde + paso;
            if (desde === -1 || hasta < 0 || hasta >= filas.length) return;
            filas.splice(hasta, 0, filas.splice(desde, 1)[0]);

            const cambios = filas
                .map(function (fila, i) { return { fila: fila, orden: i + 1 }; })
                .filter(function (x) { return Number(x.fila.orden) !== x.orden; });
            moviendoFila = true;
            document.querySelectorAll("#tbody-datos button").forEach(function (b) { b.disabled = true; });
            let error = null;
            try {
                const resultados = await Promise.all(cambios.map(function (x) {
                    return supabaseClient.from(tablaActual).update({ orden: x.orden }).eq(def.pk, x.fila[def.pk]);
                }));
                const fallo = resultados.find(function (r) { return r.error; });
                if (fallo) error = fallo.error;
            } catch (e) {
                error = e;
            } finally {
                moviendoFila = false;
            }
            await cargarDatos(); // vuelve a pintar la lista con el orden guardado (y limpia la alerta)
            if (error) mostrarAlerta("Error al cambiar el orden: " + mensajeErrorBase(error));
        }

        async function eliminar(pkValor) {
            const def = TABLAS[tablaActual];
            if (!confirm("¿Eliminar este registro de \"" + def.titulo + "\"? Esta acción no se puede deshacer." +
                (def.avisoEliminar ? "\n\n" + def.avisoEliminar : ""))) return;

            const { error } = await supabaseClient.from(tablaActual).delete().eq(def.pk, pkValor);
            if (error) {
                mostrarAlerta("Error al eliminar: " + mensajeErrorBase(error));
                return;
            }
            cargarDatos();
        }

        // ==================== INICIO ====================

        document.addEventListener("DOMContentLoaded", function () {
            modalEdicion = new bootstrap.Modal(document.getElementById("modal-edicion"));
            document.getElementById("login-password").addEventListener("keydown", function (e) {
                if (e.key === "Enter") iniciarSesion();
            });
            mostrarPanel(); // restaura la sesión si ya había iniciado
        });
    </script>
</body>
