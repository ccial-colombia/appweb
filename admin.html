    <script>
        // Tema del panel: "light" (claro), "dark" (oscuro) o "auto" (el del sistema).
        // Se guarda en este navegador y se aplica antes de pintar la página, para que no parpadee.
        // Usa el modo oscuro de Bootstrap 5.3 (atributo data-bs-theme en <html>).
        var CLAVE_TEMA = "admin-tema";
        var consultaOscuro = window.matchMedia("(prefers-color-scheme: dark)");

        function temaGuardado() {
            try {
                var tema = localStorage.getItem(CLAVE_TEMA);
                if (tema === "light" || tema === "dark") return tema;
            } catch (e) { /* sin acceso al almacenamiento: se usa el del sistema */ }
            return "auto";
        }

        var temaActual = temaGuardado();

        function aplicarTema(tema) {
            var oscuro = tema === "dark" || (tema === "auto" && consultaOscuro.matches);
            document.documentElement.setAttribute("data-bs-theme", oscuro ? "dark" : "light");
            document.querySelectorAll("#selector-tema [data-tema]").forEach(function (boton) {
                var activo = boton.getAttribute("data-tema") === tema;
                boton.classList.toggle("active", activo);
                boton.setAttribute("aria-pressed", activo ? "true" : "false");
            });
        }

        function cambiarTema(tema) {
            temaActual = tema;
            try { localStorage.setItem(CLAVE_TEMA, tema); } catch (e) { /* solo dura esta visita */ }
            aplicarTema(tema);
        }

        // En "Sistema", el panel cambia solo cuando cambia el tema del dispositivo.
        consultaOscuro.addEventListener("change", function () {
            if (temaActual === "auto") aplicarTema("auto");
        });
        document.addEventListener("DOMContentLoaded", function () { aplicarTema(temaActual); });
        aplicarTema(temaActual);
    </script>
    <!-- Bootstrap 5.3 solo en el panel (el sitio usa 5.0.1): trae el modo oscuro. -->

    <style>
        /* Fondo de la página según el tema; tarjetas, tablas y ventanas usan el de Bootstrap. */
        :root { --fondo-panel: #f4f5f7; }
        [data-bs-theme="dark"] { --fondo-panel: #16191d; }
        body { background: var(--fondo-panel); }
        #selector-tema svg { width: 1em; height: 1em; vertical-align: -0.125em; }
        /* El logo tiene partes oscuras: en tema oscuro va sobre una placa clara. */
        [data-bs-theme="dark"] .logo-panel { background: #f4f5f7; border-radius: 12px; padding: 6px 10px; box-sizing: content-box; }
        /* Encabezado de la tabla (.table-light) adaptado al tema oscuro. */
        [data-bs-theme="dark"] .table-light {
            --bs-table-color: var(--bs-body-color);
            --bs-table-bg: var(--bs-tertiary-bg);
            --bs-table-border-color: var(--bs-border-color);
        }
        .celda-texto { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #vista-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .nav-pills .nav-link { cursor: pointer; }
        /* Fondo gris para que se vean también las imágenes blancas o transparentes (logos). */
        .miniatura-rect { width: 72px; height: 48px; object-fit: contain; border-radius: 4px; background: #9aa0a6; }
        .vista-previa-rect { max-height: 160px; max-width: 100%; border-radius: 8px; display: block; background: #9aa0a6; padding: 4px; }
        /* Editor de texto amplio, estilo procesador de texto */
        .ql-container { font-size: 1rem; }
        .ql-editor { min-height: 340px; max-height: 60vh; overflow-y: auto; background: #fff; }
        .ql-toolbar.ql-snow { position: sticky; top: 0; z-index: 2; background: #fff; border-radius: 4px 4px 0 0; }
        .ql-toolbar .ql-undo, .ql-toolbar .ql-redo { width: 28px; }
        /* El área de escritura queda blanca en los dos temas: así se ve el texto como en
           la web y los colores elegidos en el editor siguen siendo legibles. */
        .ql-editor { color: #212529; }
        /* Tema oscuro: la barra de herramientas del editor. */
        [data-bs-theme="dark"] .ql-toolbar.ql-snow { background: var(--bs-tertiary-bg); }
        [data-bs-theme="dark"] .ql-toolbar.ql-snow,
        [data-bs-theme="dark"] .ql-container.ql-snow,
        [data-bs-theme="dark"] .ql-snow .ql-picker.ql-expanded .ql-picker-label,
        [data-bs-theme="dark"] .ql-snow .ql-picker.ql-expanded .ql-picker-options { border-color: var(--bs-border-color); }
        [data-bs-theme="dark"] .ql-snow .ql-picker { color: var(--bs-body-color); }
        [data-bs-theme="dark"] .ql-snow .ql-picker-options { background-color: var(--bs-body-bg); }
        [data-bs-theme="dark"] .ql-snow .ql-stroke,
        [data-bs-theme="dark"] .ql-snow .ql-stroke-miter { stroke: var(--bs-body-color); }
        [data-bs-theme="dark"] .ql-snow .ql-fill,
        [data-bs-theme="dark"] .ql-snow .ql-stroke.ql-fill { fill: var(--bs-body-color); }
        /* Botón activo o bajo el cursor: azul claro, legible sobre fondo oscuro. */
        [data-bs-theme="dark"] .ql-toolbar.ql-snow :is(button:hover, button:focus, button.ql-active, .ql-picker-label:hover, .ql-picker-label.ql-active, .ql-picker-item:hover, .ql-picker-item.ql-selected) { color: #6ea8fe; }
        [data-bs-theme="dark"] .ql-toolbar.ql-snow :is(button:hover, button:focus, button.ql-active, .ql-picker-label:hover, .ql-picker-label.ql-active, .ql-picker-item:hover, .ql-picker-item.ql-selected) :is(.ql-stroke, .ql-stroke-miter) { stroke: #6ea8fe; }
        [data-bs-theme="dark"] .ql-toolbar.ql-snow :is(button:hover, button:focus, button.ql-active, .ql-picker-label:hover, .ql-picker-label.ql-active, .ql-picker-item:hover, .ql-picker-item.ql-selected) .ql-fill { fill: #6ea8fe; }
    </style>
</head>

                .select("id, clave, pagina, titulo, orden")
                .order("pagina", { ascending: true, nullsFirst: true })
                .order("orden", { ascending: true })
                .order("id", { ascending: true });
            seccionesDisponibles = data || [];
        }

        function seccionPorClave(clave) {
            return seccionesDisponibles.find(function (x) { return x.clave === clave; }) || {};
        }

        // Posición de la sección en el catálogo (para ordenar por página y sección).
        function posicionSeccion(clave) {
            const i = seccionesDisponibles.findIndex(function (x) { return x.clave === clave; });
            return i === -1 ? Number.MAX_SAFE_INTEGER : i;
        }

        // Nombre legible de una sección a partir de su clave.
        function etiquetaSeccion(clave) {
            const s = seccionPorClave(clave);
            if (!s.clave) return clave;
            return (s.pagina ? s.pagina + " · " : "") + (s.titulo || s.clave);
        }

        function obtenerTextoPlano(html) {
            const div = document.createElement("div");
            div.innerHTML = html || "";
            return div.textContent || "";
        }

        function escaparHtml(texto) {
            const div = document.createElement("div");
            div.textContent = texto == null ? "" : String(texto);
            return div.innerHTML;
        }

        // Texto visible de una opción de un "select" (las opciones pueden ser { valor, texto }).
        function textoOpcion(c, valor) {
            const o = (c.opciones || []).find(function (x) { return typeof x === "object" && x.valor === valor; });
            return o ? o.texto : valor;
        }

        // 2516582 -> "2,4 MB"; 81920 -> "80 KB".
        function formatoTamano(bytes) {
            if (bytes == null || isNaN(bytes)) return "";
            const mb = bytes / (1024 * 1024);
            if (mb >= 1) return mb.toLocaleString("es-CO", { maximumFractionDigits: 1 }) + " MB";
            return Math.max(1, Math.round(bytes / 1024)) + " KB";
        }

        // Nombre legible de un archivo subido (sin la marca de tiempo que se le agrega al subirlo).
        function nombreDeArchivo(url) {
            let nombre = String(url || "").split("?")[0].split("/").pop();
            try { nombre = decodeURIComponent(nombre); } catch (e) { /* se deja tal cual */ }
            return nombre.replace(/^\d{10,}-/, "") || "archivo";
        }

        function esPdf(archivo) {
            return archivo.type === "application/pdf" || /\.pdf$/i.test(archivo.name);
        }

        function mostrarAlerta(mensaje) {
            const alerta = document.getElementById("alerta");
            alerta.textContent = mensaje || "";
            alerta.style.display = mensaje ? "block" : "none";
        }

        // ==================== SESIÓN ====================

        async function iniciarSesion() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            const error = document.getElementById("login-error");

            const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (err) {
                error.textContent = "Credenciales incorrectas o usuario no autorizado.";
                error.style.display = "block";
                return;
            }
            error.style.display = "none";
            mostrarPanel();
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            document.getElementById("vista-panel").style.display = "none";
            document.getElementById("vista-login").style.display = "flex";
        }

        async function mostrarPanel() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;
            document.getElementById("vista-login").style.display = "none";
            document.getElementById("vista-panel").style.display = "block";
            document.getElementById("usuario-email").textContent =
                session.user.user_metadata.display_name || session.user.email;
            await cargarSeccionesDisponibles();
            construirMenu();
            seleccionarTabla(tablaActual);
        }

        // ==================== PANEL ====================

        function construirMenu() {
            document.getElementById("menu-tablas").innerHTML = Object.keys(TABLAS).map(function (nombre) {
                return '<li class="nav-item"><a class="nav-link' + (nombre === tablaActual ? " active" : "") +
                    '" data-tabla="' + nombre + '" onclick="seleccionarTabla(\'' + nombre + '\')">' +
                    escaparHtml(TABLAS[nombre].titulo) + "</a></li>";
            }).join("");
        }

        function seleccionarTabla(nombre) {
            tablaActual = nombre;
            document.querySelectorAll("#menu-tablas .nav-link").forEach(function (enlace) {
                enlace.classList.toggle("active", enlace.dataset.tabla === nombre);
            });
            document.getElementById("titulo-tabla").textContent = TABLAS[nombre].titulo;
            // Tablas "solo editar": sus filas las crea un script SQL y no se agregan ni eliminan aquí.
            document.getElementById("btn-agregar").style.display = TABLAS[nombre].soloEditar ? "none" : "";
            cargarDatos();
        }

        function vacio(valor) {
            return valor == null || valor === "";
        }

        async function cargarDatos() {
            const def = TABLAS[tablaActual];
            const tablaPedida = tablaActual;
            mostrarAlerta("");

            // Orden: el que defina la tabla o, si no, página y orden cuando existan.
            const columnas = def.ordenarPor || def.campos
                .map(function (c) { return c.campo; })
                .filter(function (campo) { return campo === "pagina" || campo === "orden"; });
            let consulta = supabaseClient.from(tablaActual).select("*");
            columnas.forEach(function (columna) {
                consulta = consulta.order(columna, { ascending: true, nullsFirst: !!def.nulosPrimero });
            });
            consulta = consulta.order(def.pk, { ascending: true });

            // Las tablas que se filtran por la página de su sección necesitan el catálogo al día.
            const catalogo = def.paginaDeFila ? cargarSeccionesDisponibles() : null;
            const { data, error } = await consulta;
            await catalogo;
            // Si se cambió de pestaña mientras cargaba, esta respuesta ya no sirve.
            if (tablaPedida !== tablaActual) return;
            if (error) {
                mostrarAlerta("Error al cargar los datos: " + error.message);
                cargarDatos.filas = [];
            } else {
                cargarDatos.filas = data || [];
                if (def.ordenarFilas) cargarDatos.filas.sort(def.ordenarFilas);
            }
            prepararFiltroPagina();
            pintarFilas();
        }

        // Página de una fila para el filtro ("-" = sin página): la columna "pagina"
        // o, si la tabla no la tiene, la que indique su definición (paginaDeFila).
        function valorFiltro(fila) {
            const def = TABLAS[tablaActual];
            const pagina = def.paginaDeFila ? def.paginaDeFila(fila) : fila.pagina;
            return vacio(pagina) ? "-" : pagina;
        }

        // Muestra el filtro por página en las tablas que tienen esa columna.
        function prepararFiltroPagina() {
            const def = TABLAS[tablaActual];
            const filtro = document.getElementById("filtro-pagina");
            const campoPagina = def.campos.find(function (c) { return c.campo === "pagina"; }) ||
                (def.paginaDeFila ? { textoVacio: def.textoSinPagina } : null);
            if (!campoPagina) {
                filtro.style.display = "none";
                return;
            }
            const anterior = filtro.dataset.tabla === tablaActual ? filtro.value : "*";
            const valores = [];
            cargarDatos.filas.forEach(function (fila) {
                const v = valorFiltro(fila);
                if (valores.indexOf(v) === -1) valores.push(v);
            });
            filtro.innerHTML = '<option value="*">Todas las páginas</option>' + valores.map(function (v) {
                const texto = v === "-" ? (campoPagina.textoVacio || "Sin página") : v;
                return '<option value="' + escaparHtml(v) + '">' + escaparHtml(texto) + "</option>";
            }).join("");
            filtro.value = valores.indexOf(anterior) !== -1 ? anterior : "*";
            filtro.dataset.tabla = tablaActual;
            filtro.style.display = "";
        }

        function pintarFilas() {
            const def = TABLAS[tablaActual];
            const filtro = document.getElementById("filtro-pagina");
            const filtroActivo = filtro.style.display === "none" ? "*" : filtro.value;
            const data = (cargarDatos.filas || []).filter(function (fila) {
                return filtroActivo === "*" || valorFiltro(fila) === filtroActivo;
            });

            document.getElementById("thead-datos").innerHTML = "<tr>" +
                def.campos.map(function (c) { return "<th>" + escaparHtml(c.etiqueta) + "</th>"; }).join("") +
                '<th class="text-end">Acciones</th></tr>';

            const tbody = document.getElementById("tbody-datos");
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="' + (def.campos.length + 1) +
                    '" class="text-center text-muted py-4">No hay registros.' +
                    (def.soloEditar ? "" : ' Usa "+ Agregar".') + "</td></tr>";
                return;
            }

            tbody.innerHTML = data.map(function (fila) {
                const celdas = def.campos.map(function (c) {
                    const valor = fila[c.campo];
                    if (c.tipo === "checkbox") {
                        return '<td><span class="badge bg-' + (valor ? "success" : "secondary") + '">' +
                            (valor ? "Sí" : "No") + "</span></td>";
                    }
                    if (c.tipo === "image") {
                        if (vacio(valor)) return '<td class="text-muted">' + escaparHtml(c.textoVacio || "Sin foto") + "</td>";
                        return c.forma === "rectangular"
                            ? '<td><img src="' + escaparHtml(valor) + '" alt="Imagen" class="miniatura-rect" loading="lazy"></td>'
                            : '<td><img src="' + escaparHtml(valor) + '" alt="Foto" style="width:40px;height:40px;object-fit:cover;border-radius:50%;"></td>';
                    }
                    if (c.tipo === "archivo") {
                        if (vacio(valor)) return '<td class="text-muted">Sin archivo</td>';
                        const tamano = c.campoTamano ? formatoTamano(fila[c.campoTamano]) : "";
                        return '<td class="text-nowrap"><a href="' + escaparHtml(valor) + '" target="_blank" rel="noopener">Ver PDF</a>' +
                            (tamano ? ' <span class="text-muted small">' + escaparHtml(tamano) + "</span>" : "") + "</td>";
                    }
                    if (vacio(valor) && c.textoVacio) {
                        return '<td class="text-muted">' + escaparHtml(c.textoVacio) + "</td>";
                    }
                    if (c.tipo === "select" && c.opciones) {
                        const texto = textoOpcion(c, valor);
                        return '<td class="celda-texto" title="' + escaparHtml(texto) + '">' + escaparHtml(texto) + "</td>";
                    }
                    if (c.tipo === "richtext") {
                        const textoPlano = obtenerTextoPlano(valor);
                        return '<td class="celda-texto" title="' + escaparHtml(textoPlano) + '">' + escaparHtml(textoPlano) + "</td>";
                    }
                    if (c.tipo === "select" && c.opcionesDinamicas === "secciones") {
                        const texto = etiquetaSeccion(valor);
                        return '<td class="celda-texto" title="' + escaparHtml(texto) + '">' + escaparHtml(texto) + "</td>";
                    }
                    return '<td class="celda-texto" title="' + escaparHtml(valor) + '">' + escaparHtml(valor) + "</td>";
                }).join("");
                return "<tr>" + celdas +
                    '<td class="text-end text-nowrap">' +
                    '<button class="btn btn-outline-primary btn-sm me-1" onclick="abrirFormulario(' + fila[def.pk] + ')">Editar</button>' +
                    (def.soloEditar ? "" :
                        '<button class="btn btn-outline-danger btn-sm" onclick="eliminar(' + fila[def.pk] + ')">Eliminar</button>') +
                    "</td></tr>";
            }).join("");
        }

        // ==================== AGREGAR / EDITAR / ELIMINAR ====================

        async function abrirFormulario(pkValor) {
            const def = TABLAS[tablaActual];
            filaEditando = pkValor == null ? null :
                (cargarDatos.filas || []).find(function (f) { return f[def.pk] === pkValor; });

            // Refresca la lista de secciones si el formulario tiene un selector dinámico.
            if (def.campos.some(function (c) { return c.opcionesDinamicas === "secciones"; })) {
                await cargarSeccionesDisponibles();
            }

            document.getElementById("modal-titulo").textContent =
                (filaEditando ? "Editar" : "Agregar") + " — " + def.titulo;
            document.getElementById("modal-error").style.display = "none";

            // Calcular siguiente orden disponible cuando se está agregando
            let siguienteOrden = null;
            if (!filaEditando) {
                const filasExistentes = cargarDatos.filas || [];
                if (def.campos.some(function (x) { return x.campo === "orden"; })) {
                    let maxOrden = 0;
                    filasExistentes.forEach(function (f) {
                        const o = Number(f.orden);
                        if (!isNaN(o) && o > maxOrden) maxOrden = o;
                    });
                    siguienteOrden = maxOrden + 1;
                }
            }

            document.getElementById("modal-campos").innerHTML = def.campos.map(function (c) {
                const valor = filaEditando ? filaEditando[c.campo] : (c.campo === "orden" && siguienteOrden != null ? siguienteOrden : null);
                // Texto de ayuda opcional debajo del campo.
                const ayuda = c.ayuda ? '<div class="form-text">' + escaparHtml(c.ayuda) + "</div>" : "";
                if (c.tipo === "checkbox") {
                    return '<div class="form-check form-switch mb-3">' +
                        '<input class="form-check-input" type="checkbox" id="campo-' + c.campo + '"' +
                        ((filaEditando ? valor : true) ? " checked" : "") + '>' +
                        '<label class="form-check-label" for="campo-' + c.campo + '">' + escaparHtml(c.etiqueta) + "</label>" + ayuda + "</div>";
                }
                const etiqueta = '<label class="form-label" for="campo-' + c.campo + '">' + escaparHtml(c.etiqueta) +
                    (c.requerido ? ' <span class="text-danger">*</span>' : "") + "</label>";
                // Campo informativo: se muestra pero no se edita ni se guarda.
                if (c.soloLectura) {
                    const texto = vacio(valor) ? (c.textoVacio || "") : valor;
                    return '<div class="mb-3">' + etiqueta +
                        '<input class="form-control" type="text" id="campo-' + c.campo + '" value="' + escaparHtml(texto) + '" disabled>' +
                        ayuda + "</div>";
                }
                if (c.tipo === "textarea") {
                    return '<div class="mb-3">' + etiqueta +
                        '<textarea class="form-control" rows="4" id="campo-' + c.campo + '">' + escaparHtml(valor) + "</textarea>" + ayuda + "</div>";
                }
                if (c.tipo === "image") {
                    return '<div class="mb-3">' + etiqueta +
                        (valor
                            ? '<div class="mb-2"><img src="' + escaparHtml(valor) + '" alt="Foto actual" ' +
                              (c.forma === "rectangular"
                                  ? 'class="vista-previa-rect"'
                                  : 'style="max-height:120px;border-radius:8px;display:block;"') + "></div>"
                            : "") +
                        '<input class="form-control" type="file" accept="image/*" id="campo-' + c.campo + '">' +
                        (valor
                            ? '<div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="campo-' + c.campo + '-quitar">' +
                              '<label class="form-check-label" for="campo-' + c.campo + '-quitar">Quitar foto actual</label></div>'
                            : "") +
                        ayuda + "</div>";
                }
                if (c.tipo === "archivo") {
                    const tamanoActual = filaEditando && c.campoTamano ? formatoTamano(filaEditando[c.campoTamano]) : "";
                    return '<div class="mb-3">' + etiqueta +
                        (valor
                            ? '<div class="mb-2 small">Archivo actual: <a href="' + escaparHtml(valor) + '" target="_blank" rel="noopener">' +
                              escaparHtml(nombreDeArchivo(valor)) + "</a>" +
                              (tamanoActual ? ' <span class="text-muted">(' + escaparHtml(tamanoActual) + ")</span>" : "") + "</div>"
                            : "") +
                        '<input class="form-control" type="file"' + (c.soloPdf ? ' accept=".pdf,application/pdf"' : "") +
                        ' id="campo-' + c.campo + '">' + ayuda + "</div>";
                }
                if (c.tipo === "richtext") {
                    return '<div class="mb-3">' + etiqueta +
                        '<div id="campo-' + c.campo + '"></div>' + ayuda + "</div>";
                }
                if (c.tipo === "select") {
                    const opcion = function (o) {
                        return '<option value="' + escaparHtml(o.valor) + '"' +
                            (o.valor === valor ? " selected" : "") + ">" + escaparHtml(o.texto) + "</option>";
                    };
                    let opciones;
                    if (c.opcionesDinamicas === "secciones") {
                        // Agrupadas por página para encontrarlas fácil en una lista larga.
                        const grupos = [];
                        seccionesDisponibles.forEach(function (s) {
                            const nombre = s.pagina || "Global (todas las páginas)";
                            let grupo = grupos.find(function (g) { return g.nombre === nombre; });
                            if (!grupo) grupos.push(grupo = { nombre: nombre, opciones: [] });
                            grupo.opciones.push({ valor: s.clave, texto: s.titulo || s.clave });
                        });
                        opciones = grupos.map(function (g) {
                            return '<optgroup label="' + escaparHtml(g.nombre) + '">' + g.opciones.map(opcion).join("") + "</optgroup>";
                        }).join("");
                    } else {
                        opciones = (c.opciones || []).map(function (o) {
                            return opcion(typeof o === "object" ? o : { valor: o, texto: o });
                        }).join("");
                    }
                    const placeholder = c.placeholder || "— Seleccionar —";
                    return '<div class="mb-3">' + etiqueta +
                        '<select class="form-select" id="campo-' + c.campo + '">' +
                        '<option value="">' + escaparHtml(placeholder) + "</option>" + opciones + "</select>" + ayuda + "</div>";
                }
                return '<div class="mb-3">' + etiqueta +
                    '<input class="form-control" type="' + c.tipo + '" id="campo-' + c.campo +
                    '" value="' + escaparHtml(valor) + '"' + (c.tipo === "number" ? ' min="0"' : "") + ">" + ayuda + "</div>";
            }).join("");

            // Modal más ancho cuando el formulario tiene un editor de texto.
            const tieneRichtext = def.campos.some(function (c) { return c.tipo === "richtext"; });
            document.getElementById("modal-dialog").className =
                "modal-dialog" + (tieneRichtext ? " modal-lg modal-dialog-scrollable" : "");

            editoresRichText = {};
            def.campos.forEach(function (c) {
                if (c.tipo !== "richtext") return;
                const instancia = crearEditor("#campo-" + c.campo);
                const valorInicial = filaEditando ? filaEditando[c.campo] : null;
                if (valorInicial) instancia.root.innerHTML = valorInicial;
                editoresRichText[c.campo] = instancia;
            });

            modalEdicion.show();
        }

        // Registra íconos de deshacer/rehacer una sola vez para el editor.
        (function registrarIconosEditor() {
            const iconos = Quill.import("ui/icons");
            iconos["undo"] =
                '<svg viewbox="0 0 18 18"><polygon class="ql-fill ql-stroke" points="6 10 4 12 2 10 6 10"></polygon>' +
                '<path class="ql-stroke" d="M8.09,13.91A4.6,4.6,0,0,0,9,14,5,5,0,1,0,4,9"></path></svg>';
            iconos["redo"] =
                '<svg viewbox="0 0 18 18"><polygon class="ql-fill ql-stroke" points="12 10 14 12 16 10 12 10"></polygon>' +
                '<path class="ql-stroke" d="M9.91,13.91A4.6,4.6,0,0,1,9,14,5,5,0,1,1,14,9"></path></svg>';
        })();

        // Editor de texto amplio (estilo procesador de texto).
        function crearEditor(selector) {
            return new Quill(selector, {
                theme: "snow",
                placeholder: "Escribe aquí...",
                modules: {
                    history: { delay: 800, maxStack: 200, userOnly: true },
                    toolbar: {
                        container: [
                            ["undo", "redo"],
                            [{ header: [1, 2, 3, 4, false] }],
                            [{ size: ["small", false, "large", "huge"] }],
                            ["bold", "italic", "underline", "strike"],
                            [{ color: [] }, { background: [] }],
                            [{ align: [] }],
                            [{ list: "ordered" }, { list: "bullet" }],
                            [{ indent: "-1" }, { indent: "+1" }],
                            ["blockquote", "link"],
                            ["clean"]
                        ],
                        handlers: {
                            undo: function () { this.quill.history.undo(); },
                            redo: function () { this.quill.history.redo(); }
                        }
                    }
                }
            });
        }

        // Reduce las fotos grandes antes de subirlas (máximo 1600 px por lado, en WebP)
        // para que las páginas carguen rápido aunque la foto venga de un celular.
        // Si algo falla, o el navegador no genera WebP, se sube la foto original.
        async function reducirImagen(archivo) {
            const LADO_MAX = 1600;
            if (!archivo || !/^image\/(jpeg|png|webp)$/.test(archivo.type)) return archivo;
            const url = URL.createObjectURL(archivo);
            try {
                const img = new Image();
                img.src = url;
                await img.decode();
                const escala = Math.min(1, LADO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
                if (escala === 1 && archivo.size <= 400 * 1024) return archivo;
                const lienzo = document.createElement("canvas");
                lienzo.width = Math.round(img.naturalWidth * escala);
                lienzo.height = Math.round(img.naturalHeight * escala);
                lienzo.getContext("2d").drawImage(img, 0, 0, lienzo.width, lienzo.height);
                const blob = await new Promise(function (resolver) { lienzo.toBlob(resolver, "image/webp", 0.82); });
                if (!blob || blob.type !== "image/webp" || blob.size >= archivo.size) return archivo;
                return new File([blob], archivo.name.replace(/\.[^.]*$/, "") + ".webp", { type: "image/webp" });
            } catch (e) {
                return archivo;
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        // Evita guardar dos veces si se hace doble clic (crearía registros duplicados).
        async function guardar() {
            const boton = document.getElementById("btn-guardar");
            if (boton.disabled) return;
            boton.disabled = true;
            try {
                await guardarRegistro();
            } finally {
                boton.disabled = false;
                boton.textContent = "Guardar"; // por si se cambió a "Subiendo…"
            }
        }

        // Mensaje claro cuando Supabase rechaza un archivo.
        function mensajeErrorSubida(error) {
            const texto = (error && error.message) || "";
            if (/maximum allowed size|too large|payload/i.test(texto) || String(error && error.statusCode) === "413") {
                return "El archivo es demasiado grande para Supabase (máximo 50 MB en el plan gratuito).";
            }
            if (/mime type/i.test(texto)) return "Tipo de archivo no permitido: solo se aceptan PDF.";
            return "Error al subir el archivo: " + texto;
        }

        async function guardarRegistro() {
            const def = TABLAS[tablaActual];
            const registro = {};
            const errorModal = document.getElementById("modal-error");

            for (const c of def.campos) {
                if (c.soloLectura) continue; // no se envía: no cambia

                if (c.tipo === "image") {
                    const inputArchivo = document.getElementById("campo-" + c.campo);
                    const checkboxQuitar = document.getElementById("campo-" + c.campo + "-quitar");
                    const archivo = await reducirImagen(inputArchivo.files[0]);

                    if (archivo) {
                        const rutaArchivo = tablaActual + "/" + Date.now() + "-" +
                            archivo.name.replace(/[^a-zA-Z0-9_.-]/g, "_");
                        const { error: errorSubida } = await supabaseClient.storage
                            .from(c.bucket).upload(rutaArchivo, archivo, { upsert: true });
                        if (errorSubida) {
                            errorModal.textContent = "Error al subir la foto: " + errorSubida.message;
                            errorModal.style.display = "inline";
                            return;
                        }
                        const { data: urlData } = supabaseClient.storage.from(c.bucket).getPublicUrl(rutaArchivo);
                        registro[c.campo] = urlData.publicUrl;
                    } else if (checkboxQuitar && checkboxQuitar.checked) {
                        registro[c.campo] = null;
                    } else if (filaEditando) {
                        registro[c.campo] = filaEditando[c.campo];
                    } else {
                        registro[c.campo] = null;
                    }
                    continue;
                }

                // Documento (PDF): se sube al bucket y se guarda su URL pública y su tamaño.
                if (c.tipo === "archivo") {
                    const archivo = document.getElementById("campo-" + c.campo).files[0];
                    if (archivo) {
                        if (c.soloPdf && !esPdf(archivo)) {
                            errorModal.textContent = 'El campo "' + c.etiqueta + '" solo acepta archivos PDF.';
                            errorModal.style.display = "inline";
                            return;
                        }
                        // El bucket solo admite application/pdf: se fija el tipo aunque el navegador no lo informe.
                        const cuerpo = c.soloPdf && archivo.type !== "application/pdf"
                            ? new File([archivo], archivo.name, { type: "application/pdf" })
                            : archivo;
                        const rutaArchivo = tablaActual + "/" + Date.now() + "-" +
                            archivo.name.replace(/[^a-zA-Z0-9_.-]/g, "_");
                        document.getElementById("btn-guardar").textContent = "Subiendo…";
                        const { error: errorSubida } = await supabaseClient.storage
                            .from(c.bucket).upload(rutaArchivo, cuerpo, { contentType: cuerpo.type || undefined });
                        if (errorSubida) {
                            errorModal.textContent = mensajeErrorSubida(errorSubida);
                            errorModal.style.display = "inline";
                            return;
                        }
                        const { data: urlData } = supabaseClient.storage.from(c.bucket).getPublicUrl(rutaArchivo);
                        registro[c.campo] = urlData.publicUrl;
                        if (c.campoTamano) registro[c.campoTamano] = archivo.size;
                    } else if (filaEditando && !vacio(filaEditando[c.campo])) {
                        registro[c.campo] = filaEditando[c.campo];
                    } else if (c.requerido) {
                        errorModal.textContent = 'El campo "' + c.etiqueta + '" es obligatorio.';
                        errorModal.style.display = "inline";
                        return;
                    } else {
                        registro[c.campo] = null;
                    }
                    continue;
                }

                if (c.tipo === "richtext") {
                    const instancia = editoresRichText[c.campo];
                    const textoPlano = instancia.getText().trim();
                    if (c.requerido && textoPlano === "") {
                        errorModal.textContent = 'El campo "' + c.etiqueta + '" es obligatorio.';
                        errorModal.style.display = "inline";
                        return;
                    }
                    registro[c.campo] = textoPlano === "" ? null : instancia.root.innerHTML;
                    continue;
                }

                const control = document.getElementById("campo-" + c.campo);
                let valor;
                if (c.tipo === "checkbox") {
                    valor = control.checked;
                } else {
                    valor = control.value.trim();
                    if (valor === "") valor = null;
                    if (c.tipo === "number" && valor !== null) valor = Number(valor);
                }
                if (c.requerido && (valor === null || valor === "")) {
                    errorModal.textContent = 'El campo "' + c.etiqueta + '" es obligatorio.';
                    errorModal.style.display = "inline";
                    return;
                }
                registro[c.campo] = valor;
            }

            const consulta = filaEditando
                ? supabaseClient.from(tablaActual).update(registro).eq(def.pk, filaEditando[def.pk])
                : supabaseClient.from(tablaActual).insert(registro);

            const { error } = await consulta;
            if (error) {
                errorModal.textContent = "Error al guardar: " + error.message;
                errorModal.style.display = "inline";
                return;
            }
            modalEdicion.hide();
            cargarDatos();
        }

        async function eliminar(pkValor) {
            const def = TABLAS[tablaActual];
            if (!confirm("¿Eliminar este registro de \"" + def.titulo + "\"? Esta acción no se puede deshacer.")) return;

            const { error } = await supabaseClient.from(tablaActual).delete().eq(def.pk, pkValor);
            if (error) {
                mostrarAlerta("Error al eliminar: " + error.message);
                return;
            }
            cargarDatos();
        }

        // ==================== INICIO ====================

        document.addEventListener("DOMContentLoaded", function () {
            modalEdicion = new bootstrap.Modal(document.getElementById("modal-edicion"));
            document.getElementById("login-password").addEventListener("keydown", function (e) {
                if (e.key === "Enter") iniciarSesion();
            });
            mostrarPanel(); // restaura la sesión si ya había iniciado
        });
    </script>
</body>

</html>
